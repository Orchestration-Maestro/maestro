[package]
autotests = false
name = "maestro-credentials"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
maestro-text = { path = "../maestro-text" }
maestro-models = { path = "../maestro-models" }
maestro-path = { path = "../maestro-path" }
maestro-request = { path = "../maestro-request" }
indexmap = "=2.14.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "=1.53.3", default-features = false, features = ["sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true
maestro-lock = { path = "../maestro-lock" }
maestro-process = { path = "../maestro-process" }
tokio = { version = "=1.53.3", default-features = false, features = ["time", "process"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-test-directory.workspace = true
maestro-test-process.workspace = true
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "time", "macros", "test-util"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
