[package]
name = "maestro-fixture-registry-sources"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# The registry crates that fixture workspaces resolve, unpinned: the workspace lock decides each
# version when the setup script vendors them. The lock holds two sha2 versions, so its requirement
# names the series tooling uses.
[dependencies]
cargo_metadata = "*"
rustix = { version = "*", default-features = false, features = ["std", "stdio"] }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
sha2 = "0.11"
toml = "*"
