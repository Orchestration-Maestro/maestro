[package]
name = "maestro-text"
version = "0.1.0"
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true

[features]
collation = ["dep:icu_collator", "dep:icu_locale_core"]

number-format = ["dep:icu_decimal", "dep:fixed_decimal", "dep:icu_locale_core"]

date-time-format = ["number-format", "dep:icu_locale_fallback"]

[dependencies]
icu_locale_fallback = { version = "=2.3.0", optional = true }
regex = "=1.13.1"
icu_decimal = { version = "=2.3.0", features = ["alloc", "ryu"], optional = true }
fixed_decimal = { version = "=0.7.2", default-features = false, optional = true }
icu_collator = { version = "=2.3.1", optional = true }
icu_locale_core = { version = "=2.3.0", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
