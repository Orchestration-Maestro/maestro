[package]
name = "maestro-watch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify = "=8.2.0"
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "time", "sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "=1.53.2", default-features = false, features = ["test-util"] }

[lints]
workspace = true
