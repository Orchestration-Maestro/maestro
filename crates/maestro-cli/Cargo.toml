[package]
name = "maestro-cli"
version = "0.1.0"
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "string"] }
clap_complete = { version = "=4.6.5", default-features = false }
maestro-app = { path = "../maestro-app" }
maestro-agent = { path = "../maestro-agent" }
maestro-models-registry = { path = "../maestro-models-registry" }
maestro-credentials = { path = "../maestro-credentials" }
maestro-daemon = { path = "../maestro-daemon" }
maestro-extensions = { path = "../maestro-extensions" }
maestro-json = { path = "../maestro-json" }
maestro-models = { path = "../maestro-models" }
maestro-packages = { path = "../maestro-packages" }
maestro-process = { path = "../maestro-process" }
maestro-protocol = { path = "../maestro-protocol" }
maestro-resources = { path = "../maestro-resources" }
maestro-session = { path = "../maestro-session" }
maestro-settings = { path = "../maestro-settings" }
maestro-text = { path = "../maestro-text" }
maestro-tools = { path = "../maestro-tools" }
maestro-tui = { path = "../maestro-tui" }
maestro-tui-crossterm = { path = "../maestro-tui-crossterm" }
maestro-theme = { path = "../maestro-theme" }
indexmap = "=2.14.2"
ryu-js.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "sync", "time"] }
maestro-lock = { path = "../maestro-lock" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
maestro-dependencies.workspace = true
tokio = { version = "=1.53.3", default-features = false, features = ["signal", "io-util"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-listeners = { path = "../maestro-listeners" }
maestro-providers = { path = "../maestro-providers" }
futures-util = { workspace = true, features = ["async-await"] }
maestro-test-directory.workspace = true
maestro-test-process.workspace = true
maestro-tui = { path = "../maestro-tui", features = ["test-support"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }

[lints]
workspace = true
