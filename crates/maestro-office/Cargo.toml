[package]
autotests = false
name = "maestro-office"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
maestro-json = { path = "../maestro-json" }
maestro-lock = { path = "../maestro-lock" }
maestro-text = { path = "../maestro-text" }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
codepage = "=0.1.3"
encoding_rs = "=0.8.42"
indexmap = "=2.14.2"
num-traits.workspace = true
roxmltree = { version = "=0.21.1", default-features = false, features = ["std", "positions"] }
ryu-js.workspace = true
serde_json.workspace = true
url = "=2.5.8"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
