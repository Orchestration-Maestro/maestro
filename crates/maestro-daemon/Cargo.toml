[package]
name = "maestro-daemon"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
autotests = false

[dependencies]
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "sync", "time", "macros"] }
regex.workspace = true
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
sha2 = { version = "=0.11.0", default-features = false }
maestro-json = { path = "../maestro-json" }
maestro-ipc = { path = "../maestro-ipc" }
maestro-path = { path = "../maestro-path" }
serde.workspace = true
serde_json.workspace = true
maestro-settings = { path = "../maestro-settings" }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
time = { version = "=0.3.55", features = ["formatting"] }
maestro-detection = { path = "../maestro-detection" }
maestro-protocol = { path = "../maestro-protocol" }
maestro-workspace = { path = "../maestro-workspace" }
maestro-tui = { path = "../maestro-tui" }
maestro-terminal = { path = "../maestro-terminal" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-process = { path = "../maestro-process" }
maestro-dependencies.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-test-tracing.workspace = true
maestro-test-directory.workspace = true
maestro-test-process.workspace = true

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "net"] }

[dev-dependencies]
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "test-util"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
