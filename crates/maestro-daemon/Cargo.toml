[package]
name = "maestro-daemon"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true

[dependencies]
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
sha2 = { version = "=0.11.0", default-features = false }
maestro-ipc = { path = "../maestro-ipc" }
maestro-path = { path = "../maestro-path" }
serde.workspace = true
serde_json.workspace = true
maestro-settings = { path = "../maestro-settings" }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
time = { version = "=0.3.55", features = ["formatting"] }
maestro-detection = { path = "../maestro-detection" }
maestro-protocol = { path = "../maestro-protocol" }
maestro-workspace = { path = "../maestro-workspace" }
maestro-tui = { path = "../maestro-tui" }
maestro-terminal = { path = "../maestro-terminal" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true

[dev-dependencies]
tokio = { version = "=1.53.2", default-features = false, features = ["rt"] }

[lints]
workspace = true
