[package]
autotests = false
name = "maestro-interchange"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
test = false

[dependencies]
maestro-json = { path = "../maestro-json" }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["unbounded_depth"] }
indexmap = { version = "=2.14.2", features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true

[lints]
workspace = true

[features]
test-support = []

[dev-dependencies]
maestro-interchange = { path = ".", features = ["test-support"] }
maestro-test-fixtures.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
