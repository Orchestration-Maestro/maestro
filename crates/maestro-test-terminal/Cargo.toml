[package]
autotests = false
name = "maestro-test-terminal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
maestro-tui = { path = "../maestro-tui", features = ["test-support"] }

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json.workspace = true
vt100 = "=0.16.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
