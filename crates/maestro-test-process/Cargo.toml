[package]
name = "maestro-test-process"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "stdio"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-test-directory.workspace = true

[lints]
workspace = true
