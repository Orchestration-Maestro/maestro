[package]
name = "maestro-multiplexer"
version = "0.1.0"
edition.workspace = true
autotests = false
license = "Apache-2.0"
repository.workspace = true

[dependencies]
maestro-app = { path = "../maestro-app" }
maestro-protocol = { path = "../maestro-protocol" }
ratatui = { version = "=0.30.0", default-features = false, features = ["underline-color"] }
unicode-width = { version = "=0.2.2", default-features = false }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
