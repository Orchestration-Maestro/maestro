[package]
name = "maestro-chat"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
maestro-app = { path = "../maestro-app" }
maestro-tui = { path = "../maestro-tui" }
maestro-theme = { path = "../maestro-theme" }
indexmap = "=2.14.2"
serde_json.workspace = true
ryu-js.workspace = true
tokio = { version = "=1.53.2", default-features = false, features = ["sync"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
regress = { version = "=0.12.0", features = ["prohibit-unsafe"] }

[dev-dependencies]
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true
tokio = { version = "=1.53.2", default-features = false, features = ["process"] }

[lints]
workspace = true
