[package]
name = "maestro-chat"
version = "0.1.0"
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true

[dependencies]
maestro-app = { path = "../maestro-app" }
maestro-agent = { path = "../maestro-agent" }
maestro-catalog = { path = "../maestro-catalog" }
maestro-credentials = { path = "../maestro-credentials" }
maestro-export = { path = "../maestro-export" }
maestro-extensions = { path = "../maestro-extensions" }
maestro-json = { path = "../maestro-json" }
maestro-listeners = { path = "../maestro-listeners" }
maestro-models = { path = "../maestro-models" }
maestro-packages = { path = "../maestro-packages" }
maestro-process = { path = "../maestro-process" }
maestro-resources = { path = "../maestro-resources" }
maestro-session = { path = "../maestro-session" }
maestro-settings = { path = "../maestro-settings" }
maestro-text = { path = "../maestro-text", features = ["number-format"] }
maestro-tools = { path = "../maestro-tools" }
maestro-watch = { path = "../maestro-watch" }
maestro-tui = { path = "../maestro-tui" }
maestro-theme = { path = "../maestro-theme" }
maestro-path = { path = "../maestro-path" }
indexmap = "=2.14.2"
serde_json.workspace = true
ryu-js.workspace = true
tokio = { version = "=1.53.3", default-features = false, features = ["macros", "sync"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
regress = { version = "=0.12.0", features = ["prohibit-unsafe"] }
maestro-lock = { path = "../maestro-lock" }

[features]
test-support = []

[dev-dependencies]
maestro-chat = { path = ".", features = ["test-support"] }
maestro-test-fixtures.workspace = true
maestro-tui = { path = "../maestro-tui", features = ["test-support"] }
maestro-theme = { path = "../maestro-theme", features = ["test-support"] }
maestro-credentials = { path = "../maestro-credentials", features = ["test-support"] }
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true
tokio = { version = "=1.53.3", default-features = false, features = ["io-util", "macros", "process"] }
uuid = { version = "=1.27.0", default-features = false, features = ["std", "v4"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
futures-util = { workspace = true, features = ["async-await"] }
maestro-models = { path = "../maestro-models", features = ["test-support"] }
maestro-tui-crossterm = { path = "../maestro-tui-crossterm" }
maestro-test-directory.workspace = true
maestro-test-process.workspace = true
tokio = { version = "=1.53.3", default-features = false, features = ["test-util"] }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["std"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["std", "process", "stdio", "pipe"] }
tokio = { workspace = true, features = ["signal"] }
