[package]
name = "maestro-test-conventions"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde_json.workspace = true
toml = "=1.1.6"
syn = { version = "=3.0.6", default-features = false, features = ["full", "parsing", "printing", "visit"] }
cargo_metadata = { version = "=0.23.1", default-features = false }
ra-ap-rustc_lexer = "=0.176.0"
serde = { version = "=1.0.229", features = ["derive"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }

[dev-dependencies]
yaml-rust2 = { version = "=0.13.0", default-features = false }

[lints]
workspace = true
