[package]
name = "maestro-test-conventions"
version = "0.1.0"
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true

[dependencies]
serde_json.workspace = true
toml = "=1.1.6"
syn = { version = "=3.0.6", default-features = false, features = ["full", "parsing", "printing", "visit"] }
cargo_metadata = { version = "=0.23.1", default-features = false }
ra-ap-rustc_lexer = "=0.176.0"
serde = { version = "=1.0.229", features = ["derive"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }

maestro-markdown = { path = "../maestro-markdown" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-test-process.workspace = true
maestro-test-directory.workspace = true

[lints]
workspace = true
