[package]
name = "maestro-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
ryu-js.workspace = true
num-traits.workspace = true
maestro-models = { path = "../maestro-models" }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
image = { version = "=0.24.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "farbfeld", "dds", "hdr", "tiff", "pnm", "ico"] }
kamadak-exif = "=0.6.1"
jpeg-decoder = { version = "=0.3.2", default-features = false, features = ["platform_independent"] }

[package.metadata.cargo-machete]
# Enables deterministic color conversion in the existing image decoder.
ignored = ["jpeg-decoder"]

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-path = { path = "../maestro-path" }
getrandom = "=0.4.3"
