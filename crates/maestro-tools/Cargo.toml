[package]
name = "maestro-tools"
version = "0.1.0"
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true

[dependencies]
maestro-tool = { path = "../maestro-tool" }
maestro-text = { path = "../maestro-text" }
maestro-json = { path = "../maestro-json" }
serde.workspace = true
ryu-js.workspace = true
num-traits.workspace = true
maestro-models = { path = "../maestro-models" }
maestro-agent = { path = "../maestro-agent" }
maestro-tui = { path = "../maestro-tui" }
maestro-theme = { path = "../maestro-theme" }
serde_json.workspace = true
futures-util.workspace = true
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
image = { version = "=0.24.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "farbfeld", "dds", "hdr", "tiff", "pnm", "ico"] }
regex = "=1.13.1"
exif = { package = "kamadak-exif", version = "=0.6.1" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true
globset.workspace = true
regex-syntax.workspace = true
maestro-listing = { path = "../maestro-listing" }
indexmap = "=2.14.2"
maestro-path = { path = "../maestro-path" }
maestro-resources = { path = "../maestro-resources" }
maestro-process = { path = "../maestro-process" }
getrandom = "=0.4.3"
zip = { version = "=9.0.3", default-features = false, features = ["deflate-flate2"] }
owo-colors = "=4.2.1"
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "fs", "sync", "process", "time", "macros"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-test-directory.workspace = true
maestro-test-process.workspace = true
tokio = { version = "=1.53.3", default-features = false, features = ["test-util", "net", "io-util"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
