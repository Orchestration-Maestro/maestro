[package]
name = "maestro-session"
version = "0.1.0"
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true

[dependencies]
maestro-json = { path = "../maestro-json" }
maestro-text = { path = "../maestro-text" }
maestro-path = { path = "../maestro-path" }
maestro-agent = { path = "../maestro-agent" }
maestro-models = { path = "../maestro-models" }
maestro-entry = { path = "../maestro-entry" }
maestro-request = { path = "../maestro-request" }
uuid = { version = "=1.27.0", default-features = false, features = ["std", "v4", "v7"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock", "wasmbind"] }
ryu-js.workspace = true
serde_json.workspace = true
serde.workspace = true
futures-util.workspace = true
indexmap = "=2.14.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true
maestro-listing = { path = "../maestro-listing" }
maestro-lock = { path = "../maestro-lock" }
sha2 = { version = "=0.11.0", default-features = false }
maestro-resources = { path = "../maestro-resources" }
tokio = { version = "=1.53.3", default-features = false, features = ["fs", "rt"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-test-directory.workspace = true
maestro-test-process.workspace = true
tokio = { version = "=1.53.3", default-features = false, features = ["rt"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { version = "=1.27.0", default-features = false, features = ["js"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
