[package]
name = "maestro-terminal"
version = "0.1.0"
edition.workspace = true
license = "MIT"
repository.workspace = true
autotests = false

[dependencies]
num-traits.workspace = true
base64 = "=0.23.1"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
png = "=0.17.16"
icu_properties = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["shm"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
