[package]
name = "maestro-extensions-wasmtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[dependencies]
maestro-extensions = { path = "../maestro-extensions" }
futures-util = { workspace = true, features = ["std", "async-await"] }
serde.workspace = true
serde_json.workspace = true
wasmtime = { git = "https://github.com/bytecodealliance/wasmtime", rev = "ffff2e2db24a291f02429f123aba1631fa8eea67", default-features = false, features = ["std", "runtime", "cranelift", "component-model-async", "cache", "gc", "gc-drc"] }
wasmtime-wasi = { git = "https://github.com/bytecodealliance/wasmtime", rev = "ffff2e2db24a291f02429f123aba1631fa8eea67", default-features = false, features = ["p2", "p3"] }
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "sync", "net", "time", "macros"] }
maestro-lock = { path = "../maestro-lock" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-path = { path = "../maestro-path" }
maestro-dependencies.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-extensions = { path = "../maestro-extensions", features = ["test-support"] }
maestro-extensions-wasmtime = { path = ".", features = ["test-support"] }
tokio = { version = "=1.53.3", default-features = false, features = ["test-util"] }
maestro-catalog = { path = "../maestro-catalog" }
maestro-credentials = { path = "../maestro-credentials" }
maestro-models = { path = "../maestro-models" }
maestro-session = { path = "../maestro-session" }
maestro-test-directory.workspace = true
maestro-test-process = { path = "../maestro-test-process" }
maestro-theme = { path = "../maestro-theme" }
maestro-tui = { path = "../maestro-tui", features = ["test-support"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[features]
test-support = ["maestro-extensions/test-support"]

# The workspace table, except that the generated bindings need three groups at
# `deny`; every handwritten module restores them as `forbid`.
[lints.rust]
unsafe_code = "forbid"
forbidden_lint_groups = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "forbid"
missing_docs_in_private_items = "forbid"
redundant_clone = "forbid"
too_many_arguments = "deny"
fn_params_excessive_bools = "forbid"
too_many_lines = "forbid"
cognitive_complexity = "forbid"
excessive_nesting = "deny"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
