[package]
name = "maestro-workspace"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
autotests = false

[dependencies]
num-traits.workspace = true
maestro-path = { path = "../maestro-path" }
maestro-text = { path = "../maestro-text" }
maestro-protocol = { path = "../maestro-protocol" }
serde.workspace = true

serde_json.workspace = true
maestro-lock = { path = "../maestro-lock" }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-test-tracing.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
