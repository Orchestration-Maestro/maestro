[package]
autotests = false
name = "maestro-pattern"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
maestro-text = { path = "../maestro-text" }
brace-expansion = "=0.1.1"
regress = { version = "=0.12.0", features = ["prohibit-unsafe"] }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
