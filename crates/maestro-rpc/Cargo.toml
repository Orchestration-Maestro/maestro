[package]
name = "maestro-rpc"
version = "0.1.0"
edition.workspace = true
autotests = false
license = "Apache-2.0"
repository.workspace = true

[dependencies]
maestro-app = { path = "../maestro-app" }
maestro-agent = { path = "../maestro-agent" }
maestro-daemon = { path = "../maestro-daemon" }
maestro-json = { path = "../maestro-json" }
maestro-process = { path = "../maestro-process" }
maestro-protocol = { path = "../maestro-protocol" }
maestro-settings = { path = "../maestro-settings" }
tokio = { version = "=1.53.3", default-features = false, features = ["io-std", "macros", "rt", "signal", "sync", "time"] }

tracing = { version = "=0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { version = "=1.53.3", default-features = false, features = ["io-util", "macros", "rt", "sync", "test-util", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-test-directory.workspace = true
maestro-test-process.workspace = true
maestro-theme = { path = "../maestro-theme" }
maestro-tui-crossterm = { path = "../maestro-tui-crossterm" }
maestro-export = { path = "../maestro-export" }
maestro-extensions = { path = "../maestro-extensions" }
maestro-models = { path = "../maestro-models" }
maestro-session = { path = "../maestro-session" }
maestro-tools = { path = "../maestro-tools" }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
