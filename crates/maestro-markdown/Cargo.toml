[package]
name = "maestro-markdown"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
maestro-text = { path = "../maestro-text" }
entities = "=1.0.1"
unicase = "=2.10.0"
regress = { version = "=0.12.0", features = ["prohibit-unsafe"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true

[lints]
workspace = true

[dev-dependencies]
maestro-markdown = { path = ".", features = ["test-support"] }
serde.workspace = true
serde_json.workspace = true

[features]
test-support = []

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
