[package]
name = "maestro-detection"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[dependencies]
maestro-lock = { path = "../maestro-lock" }
regex = "=1.13.1"
toml = "=1.1.6"
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
maestro-protocol = { path = "../maestro-protocol" }

[target.'cfg(target_os = "linux")'.dependencies]
maestro-process = { path = "../maestro-process" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-test-directory.workspace = true
maestro-test-process.workspace = true
maestro-text = { path = "../maestro-text" }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
