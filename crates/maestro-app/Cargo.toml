[package]
name = "maestro-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
maestro-path = { path = "../maestro-path" }
maestro-watch = { path = "../maestro-watch" }

[target.'cfg(unix)'.dependencies]
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "time", "process"] }
num-traits = "=0.2.19"

[target.'cfg(unix)'.dev-dependencies]
tokio = { version = "=1.53.2", default-features = false, features = ["sync", "test-util"] }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
