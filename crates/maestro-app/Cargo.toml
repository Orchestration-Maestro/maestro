[package]
name = "maestro-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
maestro-models = { path = "../maestro-models" }
maestro-text = { path = "../maestro-text" }
maestro-path = { path = "../maestro-path" }
maestro-watch = { path = "../maestro-watch" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-tools = { path = "../maestro-tools" }

[target.'cfg(unix)'.dependencies]
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "time", "process"] }
num-traits = "=0.2.19"

[target.'cfg(unix)'.dev-dependencies]
tokio = { version = "=1.53.2", default-features = false, features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
