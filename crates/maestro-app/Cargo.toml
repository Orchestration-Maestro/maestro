[package]
name = "maestro-app"
version = "0.1.0"
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true

[dependencies]
maestro-protocol = { path = "../maestro-protocol" }
hayro = "=0.8.0"
hayro-interpret = "=0.8.0"
maestro-resources = { path = "../maestro-resources" }
maestro-models-registry = { path = "../maestro-models-registry" }
maestro-settings = { path = "../maestro-settings" }
maestro-credentials = { path = "../maestro-credentials" }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
num-traits.workspace = true
maestro-agent = { path = "../maestro-agent" }
maestro-extensions = { path = "../maestro-extensions" }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["raw_value"] }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
rand = "=0.10.3"
indexmap = "=2.14.2"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2"] }
url = "=2.5.8"
ryu-js.workspace = true
futures-util.workspace = true
maestro-models = { path = "../maestro-models" }
maestro-providers = { path = "../maestro-providers" }
maestro-listeners.workspace = true
maestro-tools = { path = "../maestro-tools" }
maestro-session = { path = "../maestro-session" }
maestro-json = { path = "../maestro-json" }
maestro-office = { path = "../maestro-office" }
maestro-tui = { path = "../maestro-tui" }
maestro-text = { path = "../maestro-text", features = ["number-format"] }
maestro-path = { path = "../maestro-path" }
maestro-watch = { path = "../maestro-watch" }
regex.workspace = true
maestro-lock = { path = "../maestro-lock" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-realpath = { path = "../maestro-realpath" }
maestro-export = { path = "../maestro-export" }
maestro-workspace = { path = "../maestro-workspace" }
maestro-packages = { path = "../maestro-packages" }
maestro-dependencies.workspace = true
maestro-text = { path = "../maestro-text", features = ["collation"] }
maestro-tools = { path = "../maestro-tools" }
maestro-process = { path = "../maestro-process" }
maestro-listing = { path = "../maestro-listing" }
maestro-theme = { path = "../maestro-theme" }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
uuid = { version = "=1.27.0", default-features = false, features = ["std", "v4"] }
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "time", "process", "sync", "io-util", "macros"] }

[target.'cfg(all(not(target_arch = "wasm32"), any(windows, all(unix, not(any(target_os = "ios", target_os = "android", target_os = "emscripten"))))))'.dependencies]
clipboard-rs = { version = "=0.2.4", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["std", "fs"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["std", "process"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-packages = { path = "../maestro-packages", features = ["test-support"] }
maestro-test-directory.workspace = true
maestro-test-process.workspace = true
tokio-tungstenite.workspace = true
futures-util = { workspace = true, features = ["async-await"] }
tokio = { version = "=1.53.3", default-features = false, features = ["rt-multi-thread", "sync", "net", "io-util", "io-std", "signal", "test-util"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.106"

[features]
test-support = ["maestro-credentials/test-support", "tokio/test-util"]

[dev-dependencies]
maestro-app = { path = ".", features = ["test-support"] }
maestro-credentials = { path = "../maestro-credentials", features = ["test-support"] }
maestro-extensions = { path = "../maestro-extensions", features = ["test-support"] }
maestro-models = { path = "../maestro-models", features = ["test-support"] }
image = { version = "=0.24.9", default-features = false, features = ["png"] }
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[[example]]
name = "startup_conversion"
path = "tests/support/startup_child.rs"
harness = false
test = false

[lints]
workspace = true

[[example]]
name = "count_prompt_tokens"
path = "scripts/count_prompt_tokens.rs"
test = true

