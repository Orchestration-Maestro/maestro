[package]
name = "maestro-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
maestro-catalog = { path = "../maestro-catalog" }
maestro-settings = { path = "../maestro-settings" }
maestro-credentials = { path = "../maestro-credentials" }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
num-traits.workspace = true
maestro-agent = { path = "../maestro-agent" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
percent-encoding = "=2.3.2"
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
rand = "=0.10.3"
zip = { version = "=6.0.0", default-features = false, features = ["deflate-flate2"] }
roxmltree = { version = "=0.21.1", default-features = false, features = ["std", "positions"] }
url = "=2.5.8"
ryu-js.workspace = true
futures-util.workspace = true
maestro-models = { path = "../maestro-models" }
maestro-tools = { path = "../maestro-tools" }
maestro-session = { path = "../maestro-session" }
maestro-json = { path = "../maestro-json" }
maestro-tui = { path = "../maestro-tui" }
maestro-text = { path = "../maestro-text", features = ["number-format"] }
maestro-path = { path = "../maestro-path" }
maestro-watch = { path = "../maestro-watch" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true
maestro-tools = { path = "../maestro-tools" }
maestro-process = { path = "../maestro-process" }
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "time", "process"] }

[target.'cfg(all(not(target_arch = "wasm32"), any(windows, all(unix, not(any(target_os = "ios", target_os = "android", target_os = "emscripten"))))))'.dependencies]
clipboard-rs = { version = "=0.2.4", default-features = false }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process"] }
tokio = { version = "=1.53.2", default-features = false, features = ["rt-multi-thread", "sync", "test-util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "=1.53.2", default-features = false, features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
