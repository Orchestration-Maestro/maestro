[package]
name = "maestro-catalog"
version = "0.1.0"
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true

[dependencies]
maestro-request = { path = "../maestro-request" }
maestro-json = { path = "../maestro-json" }
maestro-text = { path = "../maestro-text", features = ["collation"] }
maestro-models = { path = "../maestro-models" }
maestro-credentials = { path = "../maestro-credentials" }
maestro-pattern = { path = "../maestro-pattern" }
owo-colors = "=4.2.1"
serde.workspace = true
serde_json.workspace = true

indexmap = { version = "=2.14.2", features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-test-directory.workspace = true
maestro-test-process.workspace = true
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
