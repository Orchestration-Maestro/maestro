[package]
name = "maestro-catalog"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
maestro-models = { path = "../maestro-models" }
maestro-credentials = { path = "../maestro-credentials" }
maestro-pattern = { path = "../maestro-pattern" }
owo-colors = "=4.2.1"
serde.workspace = true
serde_json.workspace = true

icu_collator = "=2.3.1"
icu_locale_core = { version = "=2.3.0", default-features = false, features = ["alloc"] }

indexmap = { version = "=2.14.2", features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "sync"] }

[lints]
workspace = true
