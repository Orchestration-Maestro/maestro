[package]
autotests = false
name = "maestro-process"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true
maestro-text.workspace = true
tokio = { version = "=1.53.3", default-features = false, features = ["process", "io-util", "rt", "macros", "time", "sync"] }

[target.'cfg(unix)'.dependencies]
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "process-session"] }
signal-hook = { version = "=0.3.18", default-features = false }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process"] }
tokio = { version = "=1.53.3", default-features = false, features = ["signal"] }

[target.'cfg(unix)'.dev-dependencies]
nix.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-test-directory.workspace = true
maestro-test-process.workspace = true
maestro-test-tracing.workspace = true
tokio = { version = "=1.53.3", default-features = false, features = ["net", "sync", "test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
process-wrap = { version = "=10.0.1", default-features = false, features = ["reset-sigmask"] }
rustix = { version = "=1.1.5", default-features = false, features = ["pty", "termios"] }
tokio = { version = "=1.53.3", default-features = false, features = ["net", "signal"] }
tracing = "=0.1.44"

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
