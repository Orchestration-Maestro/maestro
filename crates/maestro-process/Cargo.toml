[package]
name = "maestro-process"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "=1.53.2", default-features = false, features = ["process", "io-util", "rt", "macros", "time"] }

[target.'cfg(unix)'.dependencies]
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "process-session"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "=1.53.2", default-features = false, features = ["net", "sync", "test-util"] }

[lints]
workspace = true
