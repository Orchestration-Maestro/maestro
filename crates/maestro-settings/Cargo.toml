[package]
autotests = false
name = "maestro-settings"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
maestro-json = { path = "../maestro-json" }
maestro-path = { path = "../maestro-path" }
maestro-resources = { path = "../maestro-resources" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "=1.53.2", default-features = false, features = ["sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "=0.4.79"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true
maestro-lock = { path = "../maestro-lock" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-test-directory.workspace = true
maestro-test-process.workspace = true

[dev-dependencies]
tokio = { version = "=1.53.2", default-features = false, features = ["sync", "rt"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
