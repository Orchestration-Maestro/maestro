[package]
name = "maestro-settings"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
ryu-js = { version = "=1.0.3", default-features = false }
serde = { version = "=1.0.229", default-features = false }
serde_stacker = "=0.1.14"
stacker = "=0.1.25"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = { version = "=0.2.190", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
