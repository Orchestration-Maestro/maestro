[package]
name = "maestro-theme"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
maestro-path = { path = "../maestro-path" }
maestro-request = { path = "../maestro-request" }
maestro-tui = { path = "../maestro-tui" }
indexmap = "=2.14.2"
serde.workspace = true
serde_json.workspace = true
num-traits.workspace = true
jsonschema = { version = "=0.58.5", default-features = false }
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }
owo-colors = "=4.2.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
icu_collator = "=2.3.1"
icu_locale_core = { version = "=2.3.0", default-features = false, features = ["alloc"] }
notify = "=8.2.0"
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "time", "sync"] }

[lints]
workspace = true
