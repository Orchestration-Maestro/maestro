[package]
name = "maestro-theme"
version = "0.1.0"
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true

[dependencies]
maestro-brand = { path = "../maestro-brand" }
maestro-json = { path = "../maestro-json" }
maestro-text = { path = "../maestro-text" }
maestro-watch = { path = "../maestro-watch" }
maestro-path = { path = "../maestro-path" }
maestro-request = { path = "../maestro-request" }
maestro-tui = { path = "../maestro-tui" }
indexmap = "=2.14.2"
serde.workspace = true
serde_json.workspace = true
num-traits.workspace = true
jsonschema = { version = "=0.58.5", default-features = false }
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }
owo-colors = "=4.2.1"
regress = { version = "=0.12.0", features = ["prohibit-unsafe"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true
maestro-listing = { path = "../maestro-listing" }
maestro-text = { path = "../maestro-text", features = ["collation", "date-time-format"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-test-directory.workspace = true
maestro-test-process.workspace = true
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "time", "sync"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
