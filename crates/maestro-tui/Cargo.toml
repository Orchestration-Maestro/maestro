[package]
name = "maestro-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
maestro-path = { path = "../maestro-path" }
maestro-cancellation = { path = "../maestro-cancellation" }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
rand = "=0.10.3"
unicode-segmentation = { version = "=1.13.3", default-features = false }
unicode-width = { version = "=0.2.2", default-features = false }
regress = { version = "=0.12.0", features = ["prohibit-unsafe"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json.workspace = true

pulldown-cmark = { version = "=0.13.4", default-features = false }

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.4.3", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
icu_collator = "=2.3.1"
icu_locale_core = { version = "=2.3.0", default-features = false, features = ["alloc"] }
tokio = { version = "=1.53.2", default-features = false, features = ["process", "io-util", "rt", "macros"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "=1.53.2", default-features = false, features = ["net"] }
