[package]
name = "maestro-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
rand = "=0.10.3"
unicode-segmentation = { version = "=1.13.3", default-features = false }
unicode-width = { version = "=0.2.2", default-features = false }
regress = { version = "=0.12.0", features = ["prohibit-unsafe"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json.workspace = true

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
