[package]
autotests = false
name = "maestro-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
maestro-markdown = { path = "../maestro-markdown" }
maestro-text = { path = "../maestro-text" }
maestro-path = { path = "../maestro-path" }
maestro-cancellation = { path = "../maestro-cancellation" }
maestro-listeners.workspace = true
maestro-resources = { path = "../maestro-resources" }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
rand = "=0.10.3"
unicode-segmentation = { version = "=1.13.3", default-features = false }
unicode-width = { version = "=0.2.2", default-features = false }
regress = { version = "=0.12.0", features = ["prohibit-unsafe"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json.workspace = true


[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.4.3", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true
maestro-listing = { path = "../maestro-listing" }
maestro-text = { path = "../maestro-text", features = ["collation"] }
tokio = { version = "=1.53.3", default-features = false, features = ["process", "rt"] }
maestro-process = { path = "../maestro-process" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-test-directory.workspace = true
maestro-test-process.workspace = true
tokio = { version = "=1.53.3", default-features = false, features = ["net", "io-util", "macros", "rt"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
