[package]
name = "maestro-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
maestro-app = { path = "../maestro-app" }
maestro-theme = { path = "../maestro-theme" }
serde.workspace = true
serde_json.workspace = true
ryu-js.workspace = true
num-traits.workspace = true
indexmap = { version = "=2.14.2", features = ["serde"] }
egui = { version = "=0.36.2", default-features = false }
usvg = { version = "=0.48.1", default-features = false }
resvg = { version = "=0.48.1", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["Window", "Navigator", "Storage", "Location", "console", "Document", "Node", "Element", "SvgElement"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true

[lints]
workspace = true
