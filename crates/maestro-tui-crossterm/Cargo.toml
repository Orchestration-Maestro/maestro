[package]
name = "maestro-tui-crossterm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
maestro-tui = { path = "../maestro-tui" }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "event", "fs", "stdio", "termios"] }
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "net", "time", "signal", "macros"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["pipe", "pty", "process"] }
tokio = { version = "=1.53.2", default-features = false, features = ["test-util"] }
