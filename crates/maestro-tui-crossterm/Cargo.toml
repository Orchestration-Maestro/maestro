[package]
autotests = false
name = "maestro-tui-crossterm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
maestro-text = { path = "../maestro-text" }
maestro-tui = { path = "../maestro-tui" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true
maestro-process = { path = "../maestro-process" }
maestro-path = { path = "../maestro-path" }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
rand = "=0.10.3"
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "time", "sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-test-process.workspace = true
tokio = { version = "=1.53.2", default-features = false, features = ["test-util", "sync"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "event", "fs", "stdio", "termios"] }
tokio = { version = "=1.53.2", default-features = false, features = ["net", "signal", "macros"] }

[target.'cfg(unix)'.dev-dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
maestro-brand = { path = "../maestro-brand" }
rustix = { version = "=1.1.5", default-features = false, features = ["pipe", "pty", "process"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
