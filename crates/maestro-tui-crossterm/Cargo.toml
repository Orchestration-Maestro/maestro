[package]
autotests = false
name = "maestro-tui-crossterm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
maestro-listeners.workspace = true
maestro-text = { path = "../maestro-text" }
maestro-tui = { path = "../maestro-tui" }
maestro-lock = { path = "../maestro-lock" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true
maestro-process = { path = "../maestro-process" }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
rand = "=0.10.3"
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "time", "sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-test-directory.workspace = true
maestro-test-process.workspace = true
tokio = { version = "=1.53.3", default-features = false, features = ["test-util", "sync"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["std", "event", "fs", "stdio", "termios"] }
tokio = { version = "=1.53.3", default-features = false, features = ["net", "signal", "macros"] }

[target.'cfg(windows)'.dependencies]
crossterm_winapi = "=0.9.1"
tokio = { version = "=1.53.3", default-features = false, features = ["macros"] }

[target.'cfg(unix)'.dev-dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
maestro-brand = { path = "../maestro-brand" }
rustix = { workspace = true, features = ["pipe", "pty", "process"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[[example]]
name = "chat_simple"
path = "tests/support/chat_simple.rs"

[[example]]
name = "image_test"
path = "tests/support/image_test.rs"

[[example]]
name = "key_tester"
path = "tests/support/key_tester.rs"

[[example]]
name = "viewport_overwrite_repro"
path = "tests/support/viewport_overwrite_repro.rs"
