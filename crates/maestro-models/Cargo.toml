[package]
name = "maestro-models"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
maestro-text = { path = "../maestro-text" }
maestro-cancellation = { path = "../maestro-cancellation" }
maestro-request = { path = "../maestro-request" }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false }
getrandom = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = { workspace = true, features = ["raw_value"] }
indexmap = { version = "=2.14.2", features = ["serde"] }
regex = "=1.13.1"
rand = "=0.10.3"
reqwest = { version = "=0.13.5", features = ["stream"] }
futures-core = { version = "=0.3.34", default-features = false, features = ["std"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }
httpdate = "=1.0.3"

num-bigint = "=0.4.8"
num-traits = "=0.2.19"
ryu-js = "=1.0.3"
unicode-segmentation = "=1.13.3"
regress = "=0.12.0"
url = "=2.5.8"
percent-encoding = "=2.3.2"
idna = "=1.1.0"
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
getrandom = { version = "=0.4.3", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uuid = { version = "=1.27.0", default-features = false }
tokio = { version = "=1.53.2", default-features = false, features = ["rt-multi-thread", "sync", "time", "net"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
aws-sdk-bedrockruntime = { version = "=1.148.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-config = { version = "=1.12.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "credentials-process", "sso"] }
aws-smithy-runtime-api = { version = "=1.19.0", features = ["client", "http-1x"] }
aws-smithy-types = { version = "=1.8.1", features = ["http-body-1-x"] }

hyper = { version = "=1.11.1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = { version = "=0.1.5", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
icu_collator = "=2.3.1"
tokio = { version = "=1.53.2", features = ["rt", "time", "test-util"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "system"] }

[target.'cfg(windows)'.dependencies]
windows-version = "=0.100.0"
