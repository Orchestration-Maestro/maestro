[package]
autotests = false
name = "maestro-models"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
maestro-brand = { path = "../maestro-brand" }
maestro-text = { path = "../maestro-text" }
maestro-json = { path = "../maestro-json" }
maestro-cancellation = { path = "../maestro-cancellation" }
maestro-request = { path = "../maestro-request" }
maestro-models-catalog = { path = "../maestro-models-catalog" }
maestro-http = { path = "../maestro-http" }
maestro-schema-validator = { path = "../maestro-schema-validator" }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false }
getrandom = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = { workspace = true, features = ["raw_value"] }
indexmap = { version = "=2.14.2", features = ["serde"] }
regex = "=1.13.1"
rand = "=0.10.3"
reqwest = { version = "=0.13.5", features = ["stream"] }
futures-core = { version = "=0.3.34", default-features = false, features = ["std"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }

num-traits = "=0.2.19"
ryu-js = "=1.0.3"
url = "=2.5.8"
percent-encoding = "=2.3.2"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
maestro-lock = { path = "../maestro-lock" }

[features]
test-support = ["maestro-request/test-support"]

[dev-dependencies]
maestro-http = { path = "../maestro-http", features = ["test-support"] }
maestro-request = { path = "../maestro-request", features = ["test-support"] }
httpdate = "=1.0.3"
maestro-test-fixtures.workspace = true

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
getrandom = { version = "=0.4.3", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-realpath = { path = "../maestro-realpath" }
maestro-dependencies.workspace = true
maestro-path = { path = "../maestro-path" }
google-cloud-auth = "=1.17.0"
uuid = { version = "=1.27.0", default-features = false }
tokio = { version = "=1.53.3", default-features = false, features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
tokio-tungstenite.workspace = true
aws-sdk-bedrockruntime = { version = "=1.148.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-config = { version = "=1.12.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "credentials-process", "sso", "credentials-login"] }
aws-sdk-signin = { version = "=1.22.0", default-features = false }
aws-credential-types = { version = "=1.3.0", default-features = false }
aws-smithy-runtime-api = { version = "=1.19.2", features = ["client", "http-1x"] }
aws-smithy-types = { version = "=1.9.1", features = ["http-body-1-x"] }

hyper = { version = "=1.11.1", default-features = false, features = ["server", "client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
http-body-util = { version = "=0.1.5", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-test-directory.workspace = true
maestro-test-process.workspace = true
image = { version = "=0.24.9", default-features = false, features = ["png"] }
aws-smithy-runtime-api = { version = "=1.19.2", features = ["test-util"] }
icu_collator = "=2.3.1"
tokio = { version = "=1.53.3", features = ["rt", "time", "test-util"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["std", "system"] }

[target.'cfg(windows)'.dependencies]
windows-version = "=0.100.0"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[example]]
name = "bedrock_browser_witness"
path = "tests/support/bedrock_browser.rs"
crate-type = ["cdylib"]

[[example]]
name = "cloud_content_browser_witness"
path = "tests/support/cloud_content_browser.rs"
crate-type = ["cdylib"]

[[example]]
name = "browser_import_check"
path = "tests/support/browser_import_check.rs"

[[example]]
name = "generate_catalog_data"
path = "scripts/generate_catalog_data.rs"

[[example]]
name = "generate_circle_fixture"
path = "scripts/generate_circle_fixture.rs"
