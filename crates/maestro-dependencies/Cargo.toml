[dependencies]
base64 = { version = "0.23.1" }
bytemuck = { version = "1.25.2", default-features = false, features = ["aarch64_simd", "derive", "extern_crate_alloc", "min_const_generics"] }
cargo_metadata = { version = "0.23.1" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "wasmbind"] }
crc32fast = { version = "1.5.2" }
flate2 = { version = "1.1.10", features = ["zlib-rs"] }
hashbrown = { version = "0.17.1" }
icu_locale_core = { version = "2.3.0", default-features = false, features = ["alloc", "zerovec"] }
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data", "utf16_iter", "utf8_iter"] }
icu_properties = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
icu_provider = { version = "2.3.1", default-features = false, features = ["alloc", "baked"] }
idna = { version = "1.1.0" }
indexmap = { version = "2.14.2", features = ["serde"] }
litemap = { version = "0.8.3", default-features = false, features = ["alloc"] }
log = { version = "0.4.34", default-features = false, features = ["std"] }
memchr = { version = "2.8.3" }
num-traits = { version = "0.2.19", features = ["i128"] }
potential_utf = { version = "0.1.6", default-features = false, features = ["alloc", "zerovec"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = { version = "1.0.47" }
regex-automata = { version = "0.4.18", default-features = false, features = ["dfa", "hybrid", "meta", "nfa", "perf", "std", "unicode"] }
regex-syntax = { version = "0.8.11" }
regress = { version = "0.12.0", features = ["prohibit-unsafe"] }
roxmltree = { version = "0.21.1" }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["alloc", "derive", "rc"] }
serde_core = { version = "1.0.229", features = ["alloc", "rc"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip", "preserve_order", "raw_value", "unbounded_depth"] }
simd-adler32 = { version = "0.3.10" }
smallvec = { version = "1.16.2", default-features = false, features = ["const_new", "union"] }
stable_deref_trait = { version = "1.2.1", default-features = false, features = ["alloc"] }
syn-7b89eefb6aaa9bf3 = { package = "syn", version = "3.0.6", features = ["extra-traits", "fold", "full", "visit", "visit-mut"] }
tinystr = { version = "0.8.4", default-features = false, features = ["alloc", "zerovec"] }
tokio = { version = "1.53.2", default-features = false, features = ["test-util"] }
unicode-width = { version = "0.2.2" }
writeable = { version = "0.6.4", default-features = false, features = ["alloc"] }
yoke = { version = "0.8.3", features = ["derive"] }
zerofrom = { version = "0.1.8", default-features = false, features = ["alloc", "derive"] }
zerotrie = { version = "0.2.5", default-features = false, features = ["alloc", "yoke", "zerofrom"] }
zerovec = { version = "0.11.8", default-features = false, features = ["alloc", "derive", "yoke"] }

[build-dependencies]
