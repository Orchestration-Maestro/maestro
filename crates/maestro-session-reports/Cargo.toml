[package]
name = "maestro-session-reports"
version = "0.1.0"
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true
publish = false

[lib]
test = false

[[example]]
name = "cost_report"
path = "scripts/cost_report.rs"

[[example]]
name = "tool_report"
path = "scripts/tool_report.rs"

[[example]]
name = "transcript_report"
path = "scripts/transcript_report.rs"

[[example]]
name = "usage_report"
path = "scripts/usage_report.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true
maestro-app = { path = "../maestro-app" }
maestro-json = { path = "../maestro-json" }
maestro-listing = { path = "../maestro-listing" }
maestro-models = { path = "../maestro-models" }
maestro-path = { path = "../maestro-path" }
maestro-process = { path = "../maestro-process" }
maestro-resources = { path = "../maestro-resources" }
maestro-session = { path = "../maestro-session" }
maestro-text = { path = "../maestro-text", features = ["number-format"] }
maestro-theme = { path = "../maestro-theme" }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
num-traits.workspace = true
ryu-js.workspace = true
indexmap = "=2.14.2"
serde_json = { workspace = true, features = ["raw_value"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-test-directory.workspace = true
maestro-test-process.workspace = true
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "time"] }

[lints]
workspace = true
