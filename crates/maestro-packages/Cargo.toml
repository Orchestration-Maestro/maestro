[package]
name = "maestro-packages"
version = "0.1.0"
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true

[dependencies]
maestro-interchange = { path = "../maestro-interchange" }
serde = { workspace = true, optional = true }
maestro-json = { path = "../maestro-json" }
maestro-text = { path = "../maestro-text" }
sha2 = { version = "=0.11.0", default-features = false }
maestro-pattern = { path = "../maestro-pattern" }
maestro-settings = { path = "../maestro-settings" }
maestro-resources = { path = "../maestro-resources" }
maestro-path = { path = "../maestro-path" }
url = "=2.5.8"
percent-encoding = "=2.3.2"
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { version = "=1.53.3", default-features = false, features = ["sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-realpath = { path = "../maestro-realpath" }
maestro-dependencies.workspace = true
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "process", "time"] }
maestro-process = { path = "../maestro-process" }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["std", "process"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
futures-util.workspace = true
maestro-test-directory.workspace = true
maestro-test-process.workspace = true

[dev-dependencies]
maestro-packages = { path = ".", features = ["test-support"] }
serde.workspace = true
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "test-util"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true

[features]
test-support = ["dep:serde"]
