[package]
name = "maestro-extensions-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Author-side contract for native-async extension components."

# `just example-index` renders these targets from the example sources.
# example-index:start
