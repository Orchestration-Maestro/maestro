[dependencies]
maestro-package = { path = "../maestro-package" }
maestro-tool = { path = "../maestro-tool" }
indexmap = { version = "=2.14.2", features = ["serde"] }
maestro-json = { path = "../maestro-json" }
maestro-entry = { path = "../maestro-entry" }
maestro-request = { path = "../maestro-request" }
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros", "realloc", "async", "async-spawn", "std", "inter-task-wakeup"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value", "unbounded_depth"] }

[dev-dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
num-traits.workspace = true
regex.workspace = true
ryu-js.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-models = { path = "../maestro-models" }
wasmtime = { git = "https://github.com/bytecodealliance/wasmtime", rev = "ffff2e2db24a291f02429f123aba1631fa8eea67", default-features = false, features = ["std", "runtime", "cranelift", "component-model-async", "cache"] }
wasmtime-wasi = { git = "https://github.com/bytecodealliance/wasmtime", rev = "ffff2e2db24a291f02429f123aba1631fa8eea67", default-features = false, features = ["p2", "p3"] }
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true

# The workspace table, except that the generated bindings need three groups at
# `deny`; every handwritten module restores them as `forbid`.
[lints.rust]
unsafe_code = "forbid"
forbidden_lint_groups = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
missing_docs_in_private_items = "forbid"
redundant_clone = "forbid"
too_many_arguments = "deny"
fn_params_excessive_bools = "forbid"
too_many_lines = "forbid"
cognitive_complexity = "forbid"
excessive_nesting = "deny"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
