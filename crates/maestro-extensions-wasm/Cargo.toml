[package]
name = "maestro-extensions-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Author-side contract for native-async extension components."

# Keep these targets in name order, so a new example inserts at its own place.
[[example]]
name = "author_component"
crate-type = ["cdylib"]

[[example]]
name = "bookmark"
path = "../../examples/extensions/bookmark.rs"
crate-type = ["cdylib"]

[[example]]
name = "hello"
path = "../../examples/extensions/hello.rs"
crate-type = ["cdylib"]

[[example]]
name = "hidden_thinking_label"
path = "../../examples/extensions/hidden_thinking_label.rs"
crate-type = ["cdylib"]

[[example]]
name = "pirate"
path = "../../examples/extensions/pirate.rs"
crate-type = ["cdylib"]

[[example]]
name = "prompt_customizer"
path = "../../examples/extensions/prompt_customizer.rs"
crate-type = ["cdylib"]

[[example]]
name = "protected_paths"
path = "../../examples/extensions/protected_paths.rs"
crate-type = ["cdylib"]

[[example]]
name = "reload_runtime"
path = "../../examples/extensions/reload_runtime.rs"
crate-type = ["cdylib"]

[[example]]
name = "shutdown_command"
path = "../../examples/extensions/shutdown_command.rs"
crate-type = ["cdylib"]

[[example]]
name = "system_prompt_header"
path = "../../examples/extensions/system_prompt_header.rs"
crate-type = ["cdylib"]

[[example]]
name = "trigger_compact"
path = "../../examples/extensions/trigger_compact.rs"
crate-type = ["cdylib"]

[[example]]
name = "with_deps"
path = "../../examples/extensions/with-deps/main.rs"
crate-type = ["cdylib"]

[[example]]
name = "working_message_test"
path = "../../examples/extensions/working_message_test.rs"
crate-type = ["cdylib"]

[dependencies]
maestro-tool = { path = "../maestro-tool" }
indexmap = { version = "=2.14.2", features = ["serde"] }
maestro-json = { path = "../maestro-json" }
maestro-entry = { path = "../maestro-entry" }
maestro-request = { path = "../maestro-request" }
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros", "realloc", "async", "std", "inter-task-wakeup"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }

[dev-dependencies]
regex.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wasmtime = { version = "=49.0.4", default-features = false, features = ["std", "runtime", "cranelift", "component-model-async", "cache"] }
wasmtime-wasi = { version = "=49.0.4", default-features = false, features = ["p2"] }
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true

# The workspace table, except that the generated bindings need three groups at
# `deny`; every handwritten module restores them as `forbid`.
[lints.rust]
unsafe_code = "forbid"
forbidden_lint_groups = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
missing_docs_in_private_items = "forbid"
redundant_clone = "forbid"
too_many_arguments = "deny"
fn_params_excessive_bools = "forbid"
too_many_lines = "forbid"
cognitive_complexity = "forbid"
excessive_nesting = "deny"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
