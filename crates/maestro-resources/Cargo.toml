[package]
name = "maestro-resources"
version = "0.1.0"
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true

[dependencies]
maestro-text = { path = "../maestro-text" }
maestro-json = { path = "../maestro-json" }
maestro-interchange = { path = "../maestro-interchange" }
maestro-path = { path = "../maestro-path" }
num-bigint.workspace = true
num-traits.workspace = true
maestro-pattern = { path = "../maestro-pattern" }
percent-encoding.workspace = true
ryu-js.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }

[dev-dependencies]
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-feature-unifier.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-test-harness.workspace = true

[lints]
workspace = true
