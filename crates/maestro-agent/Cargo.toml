[package]
name = "maestro-agent"
version = "0.1.0"
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true

[dependencies]
maestro-tool = { path = "../maestro-tool" }
maestro-text = { path = "../maestro-text" }
futures-util.workspace = true
maestro-models = { path = "../maestro-models" }
maestro-listeners.workspace = true
maestro-json = { path = "../maestro-json" }
serde_json.workspace = true

serde = { workspace = true, features = ["rc"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-test-process.workspace = true
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "sync", "macros", "net", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
