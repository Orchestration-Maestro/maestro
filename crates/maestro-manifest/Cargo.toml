[package]
name = "maestro-manifest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Selects, acquires, verifies and reads a manifest release, then publishes its settings layer."

[lib]
crate-type = ["rlib"]

[[example]]
name = "component"
path = "src/component.rs"
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["now"] }
maestro-extensions-wasm = { path = "../maestro-extensions-wasm" }
maestro-json = { path = "../maestro-json" }
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true

[lints]
workspace = true
