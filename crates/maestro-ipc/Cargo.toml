[package]
name = "maestro-ipc"
version = "0.1.0"
edition.workspace = true
autotests = false
license = "Apache-2.0"
repository.workspace = true

[target.'cfg(unix)'.dependencies]
interprocess = { workspace = true }
socket2 = { version = "=0.6.5", default-features = false }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "net"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maestro-dependencies.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-test-process.workspace = true
maestro-test-directory.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
