[workspace]
members = ["sdk", "extension-example", "extension-example-component", "probe"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros", "realloc", "async", "std"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }

[workspace.lints.rust]
unsafe_code = "forbid"
forbidden_lint_groups = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
too_many_arguments = "deny"
fn_params_excessive_bools = "forbid"
too_many_lines = "forbid"
cognitive_complexity = "forbid"
excessive_nesting = "deny"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
