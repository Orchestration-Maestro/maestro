hakari-package = "maestro-dependencies"
dep-format-version = "4"
workspace-hack-line-style = "workspace-dotted"
resolver = "3"
exact-versions = true
platforms = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Preserve runtime library ownership (docs/architecture.md): leave the guest
# crate's wasmtime test host out of traversal (verify honours this too). The
# unifier lists no wasmtime packages; the test host may build its own copies
# of shared dependencies.
[traversal-excludes]
third-party = [{ name = "wasmtime" }, { name = "wasmtime-wasi" }]
