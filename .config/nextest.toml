experimental = ["setup-scripts", "wrapper-scripts"]

# Every setup entry runs the development tool. The tooling setups serve only `maestro-tooling`
# tests, whose build always produces the tool in the target directory. The author-component
# and cargo-checks setups also serve other packages, so they run the tool from
# `target/test-setup`: a shard finds it in the downloaded bundle, and
# `just prepare-tests` installs it there first.

[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

[scripts.setup.author-component]
command = "target/test-setup/development nextest-setup author-component"

[[profile.default.scripts]]
# Native attachment searches also copy the pinned search program this setup exports.
filter = "package(maestro-extensions-wasm) | package(maestro-extensions-wasmtime) | (package(maestro-tui) & test(/^native_attachment_completion::native_(attachment_search_|literal_queries_|filename_records_)/)) | (package(maestro) & (test(component_stdout::) | test(model_streams::) | test(native_io::) | test(startup_modes::) | test(host_operations::) | test(/_example::/)))"
setup = "author-component"

[scripts.setup.cargo-checks]
command = "target/test-setup/development nextest-setup cargo-checks"

[[profile.default.scripts]]
filter = "(package(maestro-models) & test(/^browser_build::/)) | (package(maestro-extensions-wasmtime) & test(/^extension_guide::/))"
setup = "cargo-checks"

[scripts.setup.native-fixture]
command = "target/test-setup/development nextest-setup native-fixture"

[[profile.default.scripts]]
# Select the test-process owner and every declared TEST_PROCESS_CALLERS crate.
filter = """
package(=maestro)
| package(=maestro-agent)
| package(=maestro-app)
| package(=maestro-catalog)
| package(=maestro-chat)
| package(=maestro-cli)
| package(=maestro-credentials)
| package(=maestro-daemon)
| package(=maestro-detection)
| package(=maestro-extensions)
| package(=maestro-extensions-wasm)
| package(=maestro-extensions-wasmtime)
| package(=maestro-ipc)
| package(=maestro-lock)
| package(=maestro-models)
| package(=maestro-packages)
| package(=maestro-process)
| package(=maestro-resources)
| package(=maestro-rpc)
| package(=maestro-session)
| package(=maestro-settings)
| package(=maestro-test-conventions)
| package(=maestro-test-process)
| package(=maestro-test-terminal)
| package(=maestro-theme)
| package(=maestro-tooling)
| package(=maestro-tools)
| package(=maestro-tui)
| package(=maestro-tui-crossterm)
"""
setup = "native-fixture"

[scripts.setup.fixture-sources]
command = { command-line = "debug/development nextest-setup fixture-sources", relative-to = "target" }

[[profile.default.scripts]]
filter = "package(maestro-tooling)"
setup = "fixture-sources"

[scripts.setup.workspace-sources]
command = { command-line = "debug/development nextest-setup fixture-sources workspace", relative-to = "target" }

[[profile.default.scripts]]
# Vendors the complete workspace sources and installs the bundle's compiled registry units
# beside them, or builds the units when the bundle compiled them against other sources.
# The resolution test repeats the preparation without the exports the setup gives its child, so
# the warmed directory must already exist: the preparation reuses it instead of vendoring again.
filter = "package(maestro-tooling) & (test(browser_author_bootstraps_from_empty_build_state) | test(browser_resolution_never_reaches_the_shared_cargo_home) | test(browser_resolution_prepares_sources_outside_nextest))"
setup = "workspace-sources"

# Installs the bundle's browser graph the browser author tests build on, or builds it when the run
# has no bundle, once before the first of them, then copies it into one target per lane.
# The cold-start test prepares dependency sources and the compiled registry units its target
# starts from; Maestro's own crates compile from empty.
# The `browser-author` test group below selects the same tests with the same filter; change
# the two together.
[scripts.setup.browser-author]
command = { command-line = "debug/development nextest-setup browser-author", relative-to = "target" }

[[profile.default.scripts]]
filter = "package(maestro-tooling) & test(/^browser_author_build::/) & !test(browser_author_bootstraps_from_empty_build_state)"
setup = "browser-author"

[test-groups.file-trigger]
max-threads = 1

[[profile.default.overrides]]
filter = "test(file_trigger_)"
test-group = "file-trigger"

# The wrapper and the `oauth-callback` group below select the same tests; change
# the two filters together.
[scripts.wrapper.fixed-port]
command = { command-line = "target/test-setup/development nextest-wrapper fixed-port", relative-to = "workspace-root" }

[[profile.default.scripts]]
filter = "(package(maestro-models) | package(maestro-extensions-wasmtime)) & test(/(^|::)oauth_callback::/)"
run-wrapper = "fixed-port"

[test-groups.oauth-callback]
max-threads = 1

[[profile.default.overrides]]
filter = "(package(maestro-models) | package(maestro-extensions-wasmtime)) & test(/(^|::)oauth_callback::/)"
test-group = "oauth-callback"

# Same filter as the `browser-author` setup rule above: the tests that build in a lane of the
# prepared graph. Each test takes the lane its group slot numbers, so `max-threads` is the lane
# count `LANES` of the setup's browser graph module.
[test-groups.browser-author]
max-threads = 2

[[profile.default.overrides]]
filter = "package(maestro-tooling) & test(/^browser_author_build::/) & !test(browser_author_bootstraps_from_empty_build_state)"
test-group = "browser-author"

# Every test is flagged slow every 30 seconds and killed at the 120-second hang limit.
# An exception exists only for a test that needs more than 120 seconds. It keeps
# the 30-second slow flag, lengthens the kill to whole 30-second periods, and names the
# issue that removes it. Measured values are whole-test CI maxima unless the comment
# says the run was killed and the value is a lower bound; diagnostic phase timings
# come from separate non-coverage runs.

# Diagnostic browser phases: cold vendoring costs 6.859s and the first
# Cargo/Trunk build 75.636s of 93.593s. Adjacent-lock checks spend 49.324s
# in their first example check and 124.710s in browser-check (182.239s total).
# Formatting's browser-check costs 9.848s of 10.575s on the now-warm target;
# lock acquisition is below 0.001s, not the bottleneck in these serial probes.
# Retain real cold-build/lock/format assertions while #3589 fixes repeated
# build work. These phase observations are not replacement CI maxima.

# The cold-start test compiles Maestro's native tools and the WebAssembly fixture, with parallel
# compiler jobs, in a target that holds only compiled registry units. It takes every core so that
# sharing them with other tests does not stretch it past the hang limit.
[[profile.default.overrides]]
filter = "package(=maestro-tooling) & test(=browser_author_build::browser_author_bootstraps_from_empty_build_state)"
threads-required = "num-cpus"

# Priorities rank successful whole-test durations above 30s in merge-group
# run 40795869386, longest first (100 downwards). Other tests keep priority 0.
# They only order tests within a shard; limits come from the rules above.
# See docs/development.md#slowest-first-test-order for evidence and refresh steps.

