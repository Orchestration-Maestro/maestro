experimental = ["setup-scripts"]

[scripts.setup.author-component]
command = "sh .config/prepare-author-component.sh"

[[profile.default.scripts]]
filter = "package(maestro-extensions-wasm)"
setup = "author-component"

[test-groups.oauth-callback]
max-threads = 1

[[profile.default.overrides]]
filter = "package(maestro-models) & test(/(^|::)oauth_callback::/)"
test-group = "oauth-callback"

[test-groups.browser-author]
max-threads = 1

[[profile.default.overrides]]
# The cold bootstrap test builds in its own Cargo home and target directory.
filter = "package(maestro-tooling) & test(/^browser_author_build::/) & !test(=browser_author_build::browser_author_bootstraps_from_empty_build_state)"
test-group = "browser-author"
