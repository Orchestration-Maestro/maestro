experimental = ["setup-scripts"]

[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

[scripts.setup.author-component]
command = "sh .config/prepare-author-component.sh"

[[profile.default.scripts]]
filter = "package(maestro-extensions-wasm) | package(maestro-extensions-wasmtime) | (package(maestro) & (test(startup_modes::) | test(model_streams::) | test(component_output_stays_between_complete_host_frames) | test(native_io::) | test(/_example::/)))"
setup = "author-component"

[test-groups.file-trigger]
max-threads = 1

[[profile.default.overrides]]
filter = "test(file_trigger_)"
test-group = "file-trigger"

[test-groups.oauth-callback]
max-threads = 1

[[profile.default.overrides]]
filter = "(package(maestro-models) | package(maestro-extensions-wasmtime)) & test(/(^|::)oauth_callback::/)"
test-group = "oauth-callback"

[test-groups.browser-author]
max-threads = 1

[[profile.default.overrides]]
filter = "package(maestro-tooling) & test(/^browser_author_build::/) & !test(browser_author_bootstraps_from_empty_build_state)"
test-group = "browser-author"

# Every test is flagged slow every 30 seconds and killed at the 120-second hang limit.
# An exception below exists only for a test that needs more than 120 seconds. It keeps
# the 30-second slow flag, lengthens the kill to whole 30-second periods, and names the
# issue that removes it. Measured values are whole-test CI maxima; diagnostic phase
# timings come from separate non-coverage runs.

# Runtime phase evidence published in #3592: cold Component::from_file costs
# 12.782s (context), 7.872s (hook) and 6.967s (checkpoint); cache reads cost
# 0.168-0.224s. The cache namespace includes the consuming executable's
# timestamp: warming only the setup executable does not warm test processes.
# Context-using tests fall from 12.7-15.1s to 0.257-0.472s with that cause fixed.
# Each exception below goes when its own issue lands the consuming-executable
# fix through main and CI confirms it.

[[profile.default.overrides]]
filter = "package(=maestro-extensions-wasmtime) & test(=authored_streams::generic_stream_admission_is_single_pass)"
# Measured: 199.722s; cause: per-process Wasmtime compilation and instantiation of the guest component fixture; #3649
slow-timeout = { period = "30s", terminate-after = 7 }

[[profile.default.overrides]]
filter = "package(=maestro-extensions-wasmtime) & test(=canonical_schema::native_registration_and_enumeration_preserve_authored_schema_kinds)"
# Measured: 144.375s; cause: per-process Wasmtime compilation and instantiation of the guest component fixture; #3650
