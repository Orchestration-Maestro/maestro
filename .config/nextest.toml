experimental = ["setup-scripts"]

[profile.default]
slow-timeout = { period = "30s", terminate-after = 1 }

[scripts.setup.author-component]
command = "sh .config/prepare-author-component.sh"

[[profile.default.scripts]]
filter = "package(maestro-extensions-wasm) | package(maestro-extensions-wasmtime) | (package(maestro) & (test(startup_modes::) | test(model_streams::) | test(component_output_stays_between_complete_host_frames) | test(native_io::) | test(/_example::/)))"
setup = "author-component"

[test-groups.file-trigger]
max-threads = 1

[[profile.default.overrides]]
filter = "test(file_trigger_)"
test-group = "file-trigger"

[test-groups.oauth-callback]
max-threads = 1

[[profile.default.overrides]]
filter = "(package(maestro-models) | package(maestro-extensions-wasmtime)) & test(/(^|::)oauth_callback::/)"
test-group = "oauth-callback"

[test-groups.browser-author]
max-threads = 1

[[profile.default.overrides]]
filter = "package(maestro-tooling) & test(/^browser_author_build::/) & !test(browser_author_bootstraps_from_empty_build_state)"
test-group = "browser-author"

# Measured entries below retain whole-test CI maxima. Diagnostic phase
# timings come from separate non-coverage runs; they do not size the limits.

# Diagnostic: generating four 128 MiB deflated slides costs 2.401s; loading
# and rejecting the genuinely oversized extracted text costs 14.801s of
# 17.215s total. The real 512 MiB output boundary must remain exercised;
# #3589 tracks cheaper preparation/extraction without weakening that witness.

[[profile.default.overrides]]
filter = "package(=maestro-app) & test(=pptx_attachments::pptx_extracted_output_past_the_bound_fails)"
# Measured: 38.749s; cause: creating and extracting a PPTX fixture exceeding 512 MiB; #3589
slow-timeout = { period = "39s", terminate-after = 1 }

# Author-host diagnostic: Component::from_file costs 12.117s of the 12.150s
# component_release_is_not_dispose test, despite setup already warming its
# own executable. The process-local compiled map cannot cross test processes.
