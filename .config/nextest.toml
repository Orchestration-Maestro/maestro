experimental = ["setup-scripts"]

[scripts.setup.author-component]
command = "cargo test -p maestro-extensions-wasm --locked --lib -- --ignored --exact tests::build::prepare_nextest_component"

[[profile.default.scripts]]
filter = "package(maestro-extensions-wasm)"
setup = "author-component"

[test-groups.oauth-callback]
max-threads = 1

[[profile.default.overrides]]
filter = "package(maestro-models) & test(/::(response_login_closes_after_token_completion|response_auth_callback_failure_releases_listener|response_login_environment_is_read_at_binding|response_post_bind_failure_enters_fallback|callback_routes_preserve_status_and_escaped_text|listener_failure_reaches_pending_login|callback_host_changes_bind_only|listener_stops_after_exchange_starts)$/)"
test-group = "oauth-callback"
