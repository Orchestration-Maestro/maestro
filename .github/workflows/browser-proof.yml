name: Browser proof

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Runs only the Chromium job on the named ref; like every caller, it keeps the default
  # concurrency key, so its log artifact is browser-test-root-<attempt>.
  browser:
    permissions:
      contents: read
      actions: write # GitHub checks the shared workflow's pruning jobs against this grant; they skip here
    uses: Orchestration-Maestro/maestro-rust-workflows/.github/workflows/ci.yml@d6e78953b1196e9e3c6a8c5994730f7c0a4721c7 # v0.19.36
    with:
      browser-only: true
      checkout-ref: ${{ inputs.ref }}
