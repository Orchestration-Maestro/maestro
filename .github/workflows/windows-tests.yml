# Push-only evidence; never merge this branch.
name: Windows test measurement
on:
  push:
    branches: [ci/486-windows-tests]
permissions:
  contents: read
jobs:
  native:
    name: Windows (${{ matrix.shard }})
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: ['1', '2', '3', '4', doctests]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 3
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned toolchain
        run: |
          rustup show
          rustc --version --verbose
          cargo --version
      - name: Mise bootstrap
        timeout-minutes: 10
        run: |
          # https://github.com/jdx/mise/releases/download/v2026.10.2/SHASUMS256.txt
          version=2026.10.2
          executable=mise
          case "$(uname -s):$(uname -m)" in
            Linux:x86_64) platform=linux-x64 digest=8f5f6660336f572830e33cd9b378d3131e529a0d4c4f0c553776be90a1ba302a ;;
            Linux:aarch64) platform=linux-arm64 digest=8d230a5a23ac559ea24ec65280867f437000b37473d967a9bb954837592490a8 ;;
            Darwin:arm64) platform=macos-arm64 digest=66d49acecca413c8b334922584982a4907a10588912829873d6c55d0c6d42612 ;;
            Darwin:x86_64) platform=macos-x64 digest=1c6b3d4aaeba8d3b8b57e2d06e4b7825a5134b7aa6e97313bd99db6f22bac21f ;;
            MINGW*:x86_64) platform=windows-x64.exe executable=mise.exe digest=15901d0b8e0cfe76c1c3b7de4194f929244f331ca3fdf183c2e3aa17ba31634c ;;
            *) echo 'Unsupported mise runner host' >&2; exit 1 ;;
          esac
          url=https://github.com/jdx/mise/releases/download/v$version/mise-v$version-$platform
          installed=$(mise --version 2>/dev/null | cut -d ' ' -f 1) || installed=
          if [ "$installed" != "$version" ]; then
            bin=$(mktemp -d "$RUNNER_TEMP/maestro-mise.XXXXXX")
            curl --fail --location "$url" --output "$bin/$executable"
            python3 - "$digest" "$bin/$executable" <<'PYTHON'
          import hashlib
          import sys
          with open(sys.argv[2], 'rb') as source:
              raise SystemExit(hashlib.file_digest(source, 'sha256').hexdigest() != sys.argv[1])
          PYTHON
            chmod +x "$bin/$executable"
            "$bin/$executable" --version | grep "^$version "
            export PATH="$bin:$PATH"
            if [ "$executable" = mise.exe ]; then bin=$(cygpath -w "$bin"); fi
            echo "$bin" >> "$GITHUB_PATH"
          fi
      - name: Caller tools
        timeout-minutes: 10
        run: |
          if [ ! -f mise.toml ]; then
            echo 'mise.toml: caller tools require a pinned tool configuration' >&2
            exit 1
          fi
          mise install
          mise bin-paths | while IFS= read -r bin; do
            if [ "${OS:-}" = Windows_NT ]; then bin=$(cygpath -w "$bin"); fi
            echo "$bin" >> "$GITHUB_PATH"
          done
      - name: Native search tools
        run: |
          bin=$(mktemp -d "$RUNNER_TEMP/maestro-search.XXXXXX")
          curl --fail --location https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-pc-windows-msvc.zip --output "$bin/rg.zip"
          python3 - "$bin" <<'PYTHON'
          import hashlib
          import pathlib
          import sys
          import zipfile
          root = pathlib.Path(sys.argv[1])
          archive = root / 'rg.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5'
          with zipfile.ZipFile(archive) as source:
              names = [name for name in source.namelist() if name.endswith('/rg.exe')]
              assert len(names) == 1
              (root / 'rg.exe').write_bytes(source.read(names[0]))
          PYTHON
          export PATH="$bin:$PATH"
          cygpath -w "$bin" >> "$GITHUB_PATH"
          rg --version
          fd --version
          cargo nextest --version
      - name: Locked fixture sources
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path crates/maestro-tooling/tests/fixtures/browser_author/Cargo.toml
          cargo fetch --locked --manifest-path crates/maestro-web/tests/fixtures/browser_modules/module_a/Cargo.toml
          cargo fetch --locked --manifest-path crates/maestro-web/tests/fixtures/browser_modules/module_b/Cargo.toml
      - name: Tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          started=$SECONDS
          set +e
          if [ "$SHARD" = doctests ]; then
            cargo test --workspace --locked --doc 2>&1 | tee nextest.log
          else
            cargo nextest run --workspace --locked --no-fail-fast --retries 2 --flaky-result pass --final-status-level flaky --partition "count:$SHARD/4" 2>&1 | tee nextest.log
          fi
          status=${PIPESTATUS[0]}
          echo "NATIVE-RESULT shard=$SHARD wall_seconds=$((SECONDS-started)) exit=$status"
          exit "$status"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ matrix.shard }}
          path: nextest.log
          if-no-files-found: ignore
