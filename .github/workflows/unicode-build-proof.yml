# Push-only evidence; never merge this branch.
name: Unicode native build qualification
on:
  push:
    branches: [ci/1922-unicode-build-proof]
permissions:
  contents: read
jobs:
  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 3
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned toolchain
        run: |
          rustup show
          rustc --version --verbose
          cargo --version
      - name: Mise bootstrap
        run: |
          # https://github.com/jdx/mise/releases/download/v2026.10.2/SHASUMS256.txt
          version=2026.10.2
          executable=mise
          case "$(uname -s):$(uname -m)" in
            Linux:x86_64) platform=linux-x64 digest=8f5f6660336f572830e33cd9b378d3131e529a0d4c4f0c553776be90a1ba302a ;;
            Linux:aarch64) platform=linux-arm64 digest=8d230a5a23ac559ea24ec65280867f437000b37473d967a9bb954837592490a8 ;;
            Darwin:arm64) platform=macos-arm64 digest=66d49acecca413c8b334922584982a4907a10588912829873d6c55d0c6d42612 ;;
            Darwin:x86_64) platform=macos-x64 digest=1c6b3d4aaeba8d3b8b57e2d06e4b7825a5134b7aa6e97313bd99db6f22bac21f ;;
            MINGW*:x86_64) platform=windows-x64.exe executable=mise.exe digest=15901d0b8e0cfe76c1c3b7de4194f929244f331ca3fdf183c2e3aa17ba31634c ;;
            *) echo 'Unsupported mise runner host' >&2; exit 1 ;;
          esac
          url=https://github.com/jdx/mise/releases/download/v$version/mise-v$version-$platform
          installed=$(mise --version 2>/dev/null | cut -d ' ' -f 1) || installed=
          if [ "$installed" != "$version" ]; then
            bin=$(mktemp -d "$RUNNER_TEMP/maestro-mise.XXXXXX")
            curl --fail --location "$url" --output "$bin/$executable"
            python3 - "$digest" "$bin/$executable" <<'PYTHON'
          import hashlib
          import sys
          with open(sys.argv[2], 'rb') as source:
              raise SystemExit(hashlib.file_digest(source, 'sha256').hexdigest() != sys.argv[1])
          PYTHON
            chmod +x "$bin/$executable"
            "$bin/$executable" --version | grep "^$version "
            export PATH="$bin:$PATH"
            if [ "$executable" = mise.exe ]; then bin=$(cygpath -w "$bin"); fi
            echo "$bin" >> "$GITHUB_PATH"
          fi
      - name: Caller tools
        run: |
          if [ ! -f mise.toml ]; then
            echo 'mise.toml: caller tools require a pinned tool configuration' >&2
            exit 1
          fi
          mise install
          mise bin-paths | while IFS= read -r bin; do
            if [ "${OS:-}" = Windows_NT ]; then bin=$(cygpath -w "$bin"); fi
            echo "$bin" >> "$GITHUB_PATH"
          done
      - name: Native search tools
        run: |
          bin=$(mktemp -d "$RUNNER_TEMP/maestro-search.XXXXXX")
          curl --fail --location https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-pc-windows-msvc.zip --output "$bin/rg.zip"
          python3 - "$bin" <<'PYTHON'
          import hashlib
          import pathlib
          import sys
          import zipfile
          root = pathlib.Path(sys.argv[1])
          archive = root / 'rg.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5'
          with zipfile.ZipFile(archive) as source:
              names = [name for name in source.namelist() if name.endswith('/rg.exe')]
              assert len(names) == 1
              (root / 'rg.exe').write_bytes(source.read(names[0]))
          PYTHON
          export PATH="$bin:$PATH"
          cygpath -w "$bin" >> "$GITHUB_PATH"
          rg --version
          fd --version
          cargo nextest --version
      - name: Native path and dependency qualification
        run: |
          python3 -u - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          
          root = Path(os.environ["RUNNER_TEMP"]) / "unicode-build-evidence"
          root.mkdir()
          workspace = Path.cwd()
          results = []
          
          def run(name, args, env=None, expected=0):
              print(f"START {name}: {args}", flush=True)
              proc = subprocess.run(args, env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              output = proc.stdout.decode("utf-8", errors="replace")
              (root / f"{name}.log").write_text(output, encoding="utf-8")
              row = {"name": name, "command": args, "exit": proc.returncode,
                     "expected": expected, "log_sha256": hashlib.sha256(proc.stdout).hexdigest()}
              results.append(row)
              (root / "results.json").write_text(json.dumps(results, indent=2, ensure_ascii=False), encoding="utf-8")
              print(f"RESULT {name}: {proc.returncode} expected {expected}", flush=True)
              print(output[-6000:], flush=True)
              assert proc.returncode == expected, row
              return output
          
          run("host", ["rustc", "--version", "--verbose"])
          run("nasm-version", ["nasm", "-v"])
          print("NASM executable:", shutil.which("nasm"), flush=True)
          source = root / "tiny.asm"
          source.write_text("section .text\nglobal maestro_probe\nmaestro_probe: ret\n", encoding="ascii")
          for label, directory, expected in [("ascii", "target ascii", 0), ("omega", "target Ω", 1), ("cjk", "target 文", 1)]:
              out = root / directory
              out.mkdir()
              run(f"nasm-{label}", ["nasm", "-f", "win64", "-o", str(out / "tiny.obj"), str(source)], expected=expected)
              assert (out / "tiny.obj").exists() == (expected == 0)
          
          base = os.environ.copy()
          base.pop("AWS_LC_SYS_PREBUILT_NASM", None)
          ascii_env = base | {"CARGO_TARGET_DIR": str(workspace / "native target ascii")}
          unicode_env = base | {"CARGO_TARGET_DIR": str(workspace / "native target Ω")}
          run("dependency-ascii", ["cargo", "build", "--locked", "-p", "aws-lc-sys"], ascii_env)
          failed = run("dependency-unicode-red", ["cargo", "build", "--locked", "-p", "aws-lc-sys"], unicode_env, expected=101)
          assert "NASM failed" in failed and "native target O" in failed
          wrong = run("dependency-prebuilt-alone-red", ["cargo", "build", "--locked", "-p", "aws-lc-sys"], unicode_env | {"AWS_LC_SYS_PREBUILT_NASM": "1"}, expected=101)
          assert "NASM failed" in wrong
          
          paths = base["PATH"].split(os.pathsep)
          excluded = [p for p in paths if (Path(p) / "nasm.exe").is_file()]
          assert excluded, "missing real NASM exclusion"
          print("NASM-only PATH exclusions:", excluded, flush=True)
          fixed = unicode_env | {"AWS_LC_SYS_PREBUILT_NASM": "1", "PATH": os.pathsep.join(p for p in paths if p not in excluded)}
          assert shutil.which("nasm", path=fixed["PATH"]) is None
          run("dependency-unicode-green", ["cargo", "build", "--locked", "-p", "aws-lc-sys"], fixed)
          objects = list(Path(fixed["CARGO_TARGET_DIR"]).glob("debug/build/aws-lc-sys-*/out/chacha-x86_64.obj"))
          assert len(objects) == 1, objects
          print("Unicode object:", objects[0], hashlib.sha256(objects[0].read_bytes()).hexdigest(), flush=True)
          footer = ["cargo", "nextest", "run", "--locked", "-p", "maestro-app", "--test", "integration", "-E", "test(/^footer_metadata::/)", "--no-fail-fast"]
          run("app-ascii-control", footer, ascii_env)
          run("app-unicode-green", footer, fixed)
          run("guest-unicode-green", ["cargo", "nextest", "run", "--locked", "-p", "maestro-extensions-wasm", "--no-fail-fast"], fixed)
          assert (Path(fixed["CARGO_TARGET_DIR"]) / "debug/examples/prepare_author_component.exe").is_file()
          assert (Path(fixed["CARGO_TARGET_DIR"]) / "wasm32-wasip2/release/examples/author_component.wasm").is_file()
          run("guest-release-unicode-green", ["cargo", "nextest", "run", "--locked", "-p", "maestro-extensions-wasm", "--release", "-E", "test(/^tests::maestro_component_contract_keeps_sync_and_async_calls$/)", "--no-fail-fast"], fixed)
          assert (Path(fixed["CARGO_TARGET_DIR"]) / "release/examples/prepare_author_component.exe").is_file()
          print("QUALIFIED: Unicode target path retained; stock dependency prebuilts; unchanged application and author witnesses", flush=True)
          PYTHON
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unicode-native-build
          path: ${{ runner.temp }}/unicode-build-evidence
