        \n    continue\n  fi\n  unpack=$(mktemp -d)\n  tar -xzf \"$archive\" -C \"$unpack\"\n  find \"$unpack\"\
        \ -type f -name \"$binary\" -exec cp '{}' \"$bin/$binary\" \\;\n  test -x \"$bin/$binary\"\n  rm -rf \"\
        $archive\" \"$unpack\"\ndone <<'TOOLS'\nhttps://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz\
        \ 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f cargo-deny\nhttps://github.com/guppy-rs/guppy/releases/download/cargo-hakari-0.9.39/cargo-hakari-0.9.39-x86_64-unknown-linux-musl.tar.gz\
        \ 6437e3dede815ff68b7671c15ad65240a7c80118e5a6a07d68ff85d29e78d017 cargo-hakari\nhttps://github.com/bnjbvr/cargo-machete/releases/download/v0.9.2/cargo-machete-v0.9.2-x86_64-unknown-linux-musl.tar.gz\
        \ 48200087f54c55aabcd4db4af1e25742b49846c02a1b1bfa134711945b35b2e9 cargo-machete\nhttps://github.com/crate-ci/typos/releases/download/v1.51.1/typos-v1.51.1-x86_64-unknown-linux-musl.tar.gz\
        \ 93c301fd4120ff076e2cc2a6d6a61cab4a4bdb81899287c0938b452e56d1f454 typos\nhttps://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz\
        \ 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb gitleaks\nhttps://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz\
        \ e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a zizmor\nhttps://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz\
