        \ found.stderr.splitlines():\n        fields = json.loads(line).get('fields', {}) if line.startswith('{')\
        \ else {}\n        if 'advisory' in fields:\n            reported.setdefault(fields['advisory']['id'], set()).update(\n\
        \                (graph['Krate']['name'], graph['Krate']['version']) for graph in fields['graphs'])\n  \
        \  for entry in config['advisory_exceptions']:\n        if (entry['package'], entry['version']) not in reported.get(entry['id'],\
        \ set()):\n            actual = ', '.join(f'{name} {version}' for name, version in sorted(reported.get(entry['id'],\
        \ ()))) or 'no such finding'\n            raise SystemExit(f\"Cargo.lock: advisory exception {entry['id']}\
        \ is not reported for {entry['package']} {entry['version']}: {actual}\")\n    missing = {(advisory, package,\
