        path: ${{ inputs.working-directory || '.' }}/shard-${{ matrix.shard }}.lcov
        if-no-files-found: error
  tests-result:
    name: Tests (ubuntu-latest)
    needs:
    - tests
    - declaration
    if: ${{ always() && !inputs.advisory-scan && !inputs.fuzz-scan && !inputs.warm-cache && (github.repository_id
      != '1404598722' || (inputs.working-directory != '' && inputs.working-directory != '.')) }}
    runs-on: ${{ fromJSON(needs.declaration.outputs.linux_runner) }}
    steps:
    - name: All test shards passed
      env:
        RESULT: ${{ needs.tests.result }}
        DECLARATION_RESULT: ${{ needs.declaration.result }}
        COLLECT_COVERAGE: ${{ needs.declaration.outputs.coverage }}
      shell: python
      run: 'import os

        assert os.environ[''DECLARATION_RESULT''] == ''success''

        expected = {''false'': ''skipped'', ''true'': ''success''}

        assert os.environ[''COLLECT_COVERAGE''] in expected

        assert os.environ[''RESULT''] == expected[os.environ[''COLLECT_COVERAGE'']]

        '
    - name: Download shard coverage
      if: needs.declaration.outputs.enabled == 'true' && needs.declaration.outputs.coverage == 'true'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: coverage-${{ inputs.concurrency-key || 'root' }}-*
        path: coverage
        merge-multiple: true
    - name: Merge coverage
      if: needs.declaration.outputs.enabled == 'true' && needs.declaration.outputs.coverage == 'true'
      env:
        QUALITY_CONFIG: ${{ needs.declaration.outputs.quality_config }}
      run: "python3 - <<'PYTHON'\nimport json\nimport os\nimport pathlib\nlines = {}\nreports = pathlib.Path('coverage')\n\
        expected = {f'shard-{shard}.lcov' for shard in range(1, int(os.environ['TEST_SHARD_COUNT']) + 1)}\nif {path.name\
        \ for path in reports.glob('*.lcov')} != expected:\n    raise SystemExit('Missing or unexpected shard coverage\
        \ reports')\nfor name in sorted(expected):\n    source = None\n    for record in (reports / name).read_text(encoding='utf-8').splitlines():\n\
        \        if record.startswith('SF:'):\n            source = record[3:]\n        elif record.startswith('DA:'):\n\
        \            if source is None:\n                raise SystemExit(f'{name}: line without source file')\n\
        \            line, hits, *_ = record[3:].split(',')\n            key = (source, int(line))\n           \
        \ lines[key] = lines.get(key, False) or int(hits) > 0\n        elif record == 'end_of_record':\n       \
        \     source = None\nif not lines:\n    raise SystemExit('No instrumented lines in shard coverage')\ncovered\
        \ = sum(lines.values())\npercentage = covered * 100 / len(lines)\nthreshold = json.loads(os.environ.get('QUALITY_CONFIG')\
        \ or '{}').get('coverage_min_lines', 80)\nprint(f'Merged line coverage: {percentage:.2f}% ({covered}/{len(lines)}),\
        \ minimum {threshold}%')\nif percentage < threshold:\n    raise SystemExit('Merged line coverage is below\
        \ threshold')\nPYTHON\n"
  checks:
    name: Dependency, source and coverage checks
