        \nfi\nif [ -f \"$RUNNER_TEMP/sccache-error.log\" ]; then\n  token=$(python3 -c 'import secrets; print(secrets.token_hex(32))')\n\
        \  echo \"::stop-commands::$token\"\n  cat \"$RUNNER_TEMP/sccache-error.log\"\n  printf '\\n::%s::\\n' \"\
