        \  echo \"::stop-commands::$token\"\n  cat \"$RUNNER_TEMP/sccache-error.log\"\n  printf '\\n::%s::\\n' \"\
        $token\"\nfi\n"
    - name: Upload compile cache errors
      if: always() && (steps.cache-statistics.outputs.write_errors == 'true' || (inputs.concurrency-key == 'maestro-proof'
        && steps.cache-statistics.outcome == 'success'))
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with: *id003
    - name: Seal compile cache
      id: cache-seal
      run: "if ! sccache --stop-server; then\n  echo 'Compile cache snapshot save skipped: server stop failed'\n\
        \  exit 0\nfi\npython3 - <<'PYTHON'\nimport os\nimport pathlib\nimport stat\nfiles = size = 0\ntry:\n  \
        \  def failed(error):\n        raise error\n    for directory, _, names in os.walk(os.environ['SCCACHE_DIR'],\
        \ onerror=failed):\n        for name in names:\n            metadata = pathlib.Path(directory, name).lstat()\n\
        \            if stat.S_ISREG(metadata.st_mode):\n                files += 1\n                size += metadata.st_size\n\
        except OSError:\n    print('Compile cache snapshot save skipped: cache inspection failed')\nelse:\n    print(f'Compile\
        \ cache snapshot: {files} files, {size} bytes')\n    if not files or not size:\n        print('Compile cache\
        \ snapshot save skipped: empty cache')\n    elif size > 1073741824:\n        print('Compile cache snapshot\
        \ save skipped: exceeds 1073741824 bytes')\n    else:\n        with open(os.environ['GITHUB_OUTPUT'], 'a',\
        \ encoding='utf-8') as output:\n            output.write('eligible=true\\n')\nPYTHON\n"
  tests:
    needs: declaration
    name: ${{ inputs.warm-cache && 'Warm coverage cache' || matrix.shard == 'doctests' && 'Doctests' || format('Test
      shard ({0}/{1})', matrix.shard, needs.declaration.outputs.test_shard_count) }}
    if: ${{ needs.declaration.outputs.coverage == 'true' && !inputs.advisory-scan && !inputs.fuzz-scan && (github.repository_id
      != '1404598722' || (inputs.working-directory != '' && inputs.working-directory != '.')) }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.warm-cache && '["warm"]' || needs.declaration.outputs.test_shards) }}
    runs-on: ${{ fromJSON(needs.declaration.outputs.linux_runner) }}
    env:
      ADDITIONAL_LOCKED_MANIFESTS: ${{ needs.declaration.outputs.additional_locked_manifests }}
      WARM_CACHE: ${{ inputs.warm-cache }}
      WARM_TEST_FILTER: ${{ fromJSON(needs.declaration.outputs.warm_test_filter) }}
      SHARD: ${{ matrix.shard }}
      TEST_PACKAGES: ${{ needs.declaration.outputs.packages }}
      COLLECT_COVERAGE: ${{ needs.declaration.outputs.coverage }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        repository: ${{ inputs.checkout-repository || github.repository }}
        path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
        ref: ${{ inputs.checkout-ref || github.sha }}
    - name: Free instrumented build space
      if: runner.environment == 'github-hosted' && (inputs.warm-cache || needs.declaration.outputs.enabled == 'true')
      run: '# The deletion overlaps the toolchain, tools and compilation; the build needs the space minutes later.

        sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc >/dev/null 2>&1 &

        '
    - name: Test toolchain
      run: 'rustup show

        toolchain=$(rustup show active-toolchain)

        echo "RUSTUP_TOOLCHAIN=${toolchain%% *}" >> "$GITHUB_ENV"

        rustup component add llvm-tools-preview

        '
    - name: Compile cache identity
      id: cache-identity
      env: *id001
      run: "python3 - <<'PYTHON'\nimport hashlib\nimport json\nimport os\nimport subprocess\nshape = os.environ['CACHE_JOB']\n\
        if shape == 'tests':\n    coverage = os.environ['CACHE_WARM'] == 'true' or (os.environ['CACHE_ENABLED']\
        \ == 'true' and os.environ['CACHE_COVERAGE'] == 'true' and os.environ.get('SHARD', '') not in ('', 'doctests'))\n\
        \    shape = 'tests-coverage' if coverage else 'tests-plain'\nelif shape == 'targets':\n    shape += '-clippy-'\
        \ + os.environ['CACHE_TARGET']\ncompiler = subprocess.check_output(['rustc', '-vV'], text=True)\nidentity\
        \ = [os.environ[name] for name in ['CALLER_REPOSITORY', 'CALLER_DIRECTORY', 'HOST_OS', 'HOST_ARCH']] + [compiler,\
        \ shape]\ndigest = hashlib.sha256(json.dumps(identity, ensure_ascii=True, separators=(',', ':')).encode('utf-8')).hexdigest()\n\
        prefix = f'maestro-compile-v1-{digest}-'\ncall = hashlib.sha256(os.environ['CACHE_CALL'].encode('utf-8')).hexdigest()\n\
        suffix = '-'.join(os.environ[name] for name in ['GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'CACHE_JOB', 'CACHE_INDEX'])\
        \ + '-' + call\nwriter = os.environ['GITHUB_EVENT_NAME'] == 'push' and os.environ['GITHUB_REF'] == 'refs/heads/'\
        \ + os.environ['CACHE_DEFAULT_BRANCH']\nif os.environ['CACHE_JOB'] == 'tests':\n    shard = os.environ.get('SHARD',\
        \ '')\n    writer = writer and (shard in ('warm', '1') or (shard == 'doctests' and os.environ['CACHE_ENABLED']\
        \ == 'true' and os.environ['CACHE_COVERAGE'] == 'true'))\nwith open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8')\
        \ as output:\n    output.write(f'prefix={prefix}\\nkey={prefix}{suffix}\\nwriter={str(writer).lower()}\\\
        n')\nPYTHON\n"
    - name: Restore compile cache
      id: cache-restore
      continue-on-error: true
      uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
      with: *id002
    - name: Compile cache
      env:
        CACHE_RESTORE_OUTCOME: ${{ steps.cache-restore.outcome }}
        CACHE_RESTORE_MATCHED: ${{ steps.cache-restore.outputs.cache-hit }}
      timeout-minutes: 10
      run: "version=0.18.0\ncase \"$(uname -s):$(uname -m)\" in\n  Linux:x86_64) platform=x86_64-unknown-linux-musl\
        \ digest=45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89 ;;\n  Linux:aarch64) platform=aarch64-unknown-linux-musl\
        \ digest=2b3284d5da3b46a47dc4229e75bb7b88ac4aa99c8d754fb7d2f84997e5a4354a ;;\n  Darwin:arm64) platform=aarch64-apple-darwin\
        \ digest=308184519b646f5125289e8515b36f6ca65a13a041923994aebe702348674e8e ;;\n  *) echo 'Unsupported compile\
        \ cache runner host' >&2; exit 1 ;;\nesac\nname=sccache-v$version-$platform\nbin=$(mktemp -d \"$RUNNER_TEMP/maestro-sccache.XXXXXX\"\
        )\narchive=$(mktemp)\ncurl --fail --retry 3 --location \"https://github.com/mozilla/sccache/releases/download/v$version/$name.tar.gz\"\
        \ --output \"$archive\"\npython3 - \"$digest\" \"$archive\" <<'PYTHON'\nimport hashlib\nimport sys\nwith\
        \ open(sys.argv[2], 'rb') as source:\n    raise SystemExit(hashlib.file_digest(source, 'sha256').hexdigest()\
        \ != sys.argv[1])\nPYTHON\ntar -xzf \"$archive\" -C \"$bin\" --strip-components=1 \"$name/sccache\"\nrm\
        \ \"$archive\"\ntest -x \"$bin/sccache\"\necho \"$bin\" >> \"$GITHUB_PATH\"\nif [ \"$CACHE_RESTORE_OUTCOME\"\
        \ = failure ] || { [ \"$CACHE_RESTORE_MATCHED\" != true ] && [ \"$CACHE_RESTORE_MATCHED\" != false ]; };\
        \ then\n  rm -rf \"$RUNNER_TEMP/maestro-sccache\"\n  echo 'Compile cache snapshot restore failed; using\
        \ an empty local cache'\nfi\nexport SCCACHE_DIR=\"$RUNNER_TEMP/maestro-sccache\" SCCACHE_CACHE_SIZE=1073741824\n\
        export SCCACHE_LOCAL_RW_MODE=READ_WRITE SCCACHE_GHA_ENABLED=false CARGO_INCREMENTAL=0\nexport SCCACHE_SKIP_CACHE_CHECK=true\
        \ SCCACHE_ERROR_LOG=\"$RUNNER_TEMP/sccache-error.log\" SCCACHE_LOG=debug\n{ echo CARGO_BUILD_RUSTC_WRAPPER=sccache;\
        \ env | grep -E '^(SCCACHE_(DIR|CACHE_SIZE|LOCAL_RW_MODE|GHA_ENABLED|SKIP_CACHE_CHECK|ERROR_LOG|LOG)|CARGO_INCREMENTAL)=';\
        \ } >> \"$GITHUB_ENV\"\nPATH=\"$bin:$PATH\" sccache --start-server\n"
    - name: Coverage tools
      timeout-minutes: 10
      run: "bin=$(mktemp -d \"$RUNNER_TEMP/maestro-coverage-tools.XXXXXX\")\nwhile read -r url digest binary; do\n\
        \  archive=$(mktemp)\n  curl --fail --retry 3 --location \"$url\" --output \"$archive\"\n  printf '%s  %s\\\
        n' \"$digest\" \"$archive\" | sha256sum --check --status\n  tar -xzf \"$archive\" -C \"$bin\" \"$binary\"\
        \n  test -x \"$bin/$binary\"\n  rm \"$archive\"\ndone <<'TOOLS'\nhttps://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz\
        \ 3fca950394a3c49457657c158b1619cec8dfd2647ae5b48746734c0ab969a522 cargo-llvm-cov\nhttps://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/cargo-nextest-0.9.148-x86_64-unknown-linux-musl.tar.gz\
        \ bf92cb81450872d960ffa13857a83084d557ec0cdc141663d263bb23ef756f97 cargo-nextest\nTOOLS\necho \"TOOLS=$bin\"\
        \ >> \"$GITHUB_ENV\"\necho \"$bin\" >> \"$GITHUB_PATH\"\n"
    - name: Fetch additional locked manifests
      if: needs.declaration.outputs.additional_locked_manifests != '[]'
      run: "python3 - <<'PYTHON'\nimport json\nimport os\nimport subprocess\nimport sys\nfor manifest in json.loads(os.environ['ADDITIONAL_LOCKED_MANIFESTS']):\n\
        \    print(f'Fetching locked dependencies: {manifest}', file=sys.stderr, flush=True)\n    result = subprocess.run(['cargo',\
        \ 'fetch', '--locked', '--manifest-path', manifest])\n    if result.returncode:\n        sys.exit(result.returncode)\n\
        PYTHON\n"
    - name: Tests
      timeout-minutes: 45
      if: ${{ !inputs.warm-cache && needs.declaration.outputs.enabled != 'true' }}
      run: "cargo fetch --locked\nmapfile -d '' -t packages < <(python3 -c 'import json, os; print(\"\".join(\"\
        -p\\0\" + name + \"\\0\" for name in json.loads(os.environ.get(\"TEST_PACKAGES\", \"[]\"))), end=\"\")')\n\
        if [ -z \"${TEST_PACKAGES:-}\" ]; then packages=(--workspace); fi\nif [ \"${TEST_PACKAGES:-}\" = '[]' ];\
        \ then exit 0; fi\nif [ \"${SHARD:-}\" != doctests ]; then\n  \"$TOOLS/cargo-nextest\" nextest run --user-config-file\
        \ none --ignore-default-filter --locked \"${packages[@]}\" --retries 2 --flaky-result pass --final-status-level\
        \ flaky --partition \"count:$SHARD/$TEST_SHARD_COUNT\" --no-tests pass 2>&1 | tee nextest.log\nfi\nif [[\
        \ \"$SHARD\" == doctests || ( \"$SHARD\" == 1 && \"${COLLECT_COVERAGE:-false}\" != true ) ]]; then\n  cargo\
        \ test --locked --doc \"${packages[@]}\"\nfi\n"
    - name: Search tools
      timeout-minutes: 10
      if: inputs.warm-cache || needs.declaration.outputs.enabled == 'true'
      run: "# Digests: ripgrep's release .sha256 file and fd's GitHub release asset digest.\nbin=$(mktemp -d \"\
        $RUNNER_TEMP/maestro-search-bin.XXXXXX\")\nwhile read -r url digest binary; do\n  archive=$(mktemp)\n  curl\
        \ --fail --retry 3 --location \"$url\" --output \"$archive\"\n  printf '%s  %s\\n' \"$digest\" \"$archive\"\
        \ | sha256sum --check --status\n  unpack=$(mktemp -d)\n  tar -xzf \"$archive\" -C \"$unpack\"\n  find \"\
        $unpack\" -type f -name \"$binary\" -exec cp '{}' \"$bin/$binary\" \\;\n  test -x \"$bin/$binary\"\n  rm\
        \ -rf \"$archive\" \"$unpack\"\ndone <<'TOOLS'\nhttps://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz\
        \ 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c rg\nhttps://github.com/sharkdp/fd/releases/download/v10.5.0/fd-v10.5.0-x86_64-unknown-linux-musl.tar.gz\
        \ 761c72dc8e120d85b22292063be8a796e2eeb20eb3e4f38b8fa2343ccf3514a7 fd\nTOOLS\n\"$bin/rg\" --version\n\"\
        $bin/fd\" --version\necho \"$bin\" >> \"$GITHUB_PATH\"\n"
    - name: Mise bootstrap
      timeout-minutes: 10
      if: needs.declaration.outputs.test_tools == 'true'
      run: "# https://github.com/jdx/mise/releases/download/v2026.10.2/SHASUMS256.txt\nversion=2026.10.2\nexecutable=mise\n\
        case \"$(uname -s):$(uname -m)\" in\n  Linux:x86_64) platform=linux-x64 digest=8f5f6660336f572830e33cd9b378d3131e529a0d4c4f0c553776be90a1ba302a\
        \ ;;\n  Linux:aarch64) platform=linux-arm64 digest=8d230a5a23ac559ea24ec65280867f437000b37473d967a9bb954837592490a8\
        \ ;;\n  Darwin:arm64) platform=macos-arm64 digest=66d49acecca413c8b334922584982a4907a10588912829873d6c55d0c6d42612\
        \ ;;\n  Darwin:x86_64) platform=macos-x64 digest=1c6b3d4aaeba8d3b8b57e2d06e4b7825a5134b7aa6e97313bd99db6f22bac21f\
        \ ;;\n  MINGW*:x86_64) platform=windows-x64.exe executable=mise.exe digest=15901d0b8e0cfe76c1c3b7de4194f929244f331ca3fdf183c2e3aa17ba31634c\
        \ ;;\n  *) echo 'Unsupported mise runner host' >&2; exit 1 ;;\nesac\nurl=https://github.com/jdx/mise/releases/download/v$version/mise-v$version-$platform\n\
        installed=$(mise --version 2>/dev/null | cut -d ' ' -f 1) || installed=\nif [ \"$installed\" != \"$version\"\
        \ ]; then\n  bin=$(mktemp -d \"$RUNNER_TEMP/maestro-mise.XXXXXX\")\n  curl --fail --retry 3 --location \"\
        $url\" --output \"$bin/$executable\"\n  python3 - \"$digest\" \"$bin/$executable\" <<'PYTHON'\nimport hashlib\n\
        import sys\nwith open(sys.argv[2], 'rb') as source:\n    raise SystemExit(hashlib.file_digest(source, 'sha256').hexdigest()\
        \ != sys.argv[1])\nPYTHON\n  chmod +x \"$bin/$executable\"\n  \"$bin/$executable\" --version | grep \"^$version\
        \ \"\n  export PATH=\"$bin:$PATH\"\n  if [ \"$executable\" = mise.exe ]; then bin=$(cygpath -w \"$bin\"\
        ); fi\n  echo \"$bin\" >> \"$GITHUB_PATH\"\nfi\n"
    - name: Test tools
      timeout-minutes: 10
      if: needs.declaration.outputs.test_tools == 'true'
      run: "if [ ! -f mise.toml ]; then\n  echo 'mise.toml: caller tools require a pinned tool configuration' >&2\n\
        \  exit 1\nfi\nmise install\nmise bin-paths | while IFS= read -r bin; do\n  if [ \"${OS:-}\" = Windows_NT\
        \ ]; then bin=$(cygpath -w \"$bin\"); fi\n  echo \"$bin\" >> \"$GITHUB_PATH\"\ndone\n"
    - name: Reserved ports
      if: runner.environment == 'github-hosted' && needs.declaration.outputs.reserved_ports != ''
      env:
        RESERVED_PORTS: ${{ needs.declaration.outputs.reserved_ports }}
      run: sudo sysctl -w net.ipv4.ip_local_reserved_ports="$RESERVED_PORTS"
    - name: Isolated tests
      timeout-minutes: 45
      if: inputs.warm-cache || needs.declaration.outputs.enabled == 'true'
      env:
        CARGO_COVERAGE_MIN_LINES: ''
      run: "python3 - <<'PYTHON'\nimport os\nnames = '''ANTHROPIC_API_KEY ANTHROPIC_OAUTH_TOKEN OPENAI_API_KEY GEMINI_API_KEY\n\
        GROQ_API_KEY CEREBRAS_API_KEY XAI_API_KEY OPENROUTER_API_KEY ZAI_API_KEY\nMISTRAL_API_KEY MINIMAX_API_KEY\
        \ MINIMAX_CN_API_KEY KIMI_API_KEY HF_TOKEN\nAI_GATEWAY_API_KEY OPENCODE_API_KEY COPILOT_GITHUB_TOKEN GH_TOKEN\
        \ GITHUB_TOKEN\nGOOGLE_APPLICATION_CREDENTIALS GOOGLE_CLOUD_PROJECT GCLOUD_PROJECT\nGOOGLE_CLOUD_LOCATION\
        \ AWS_PROFILE AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY\nAWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION AWS_BEARER_TOKEN_BEDROCK\n\
        AWS_CONTAINER_CREDENTIALS_RELATIVE_URI AWS_CONTAINER_CREDENTIALS_FULL_URI\nAWS_WEB_IDENTITY_TOKEN_FILE BEDROCK_EXTENSIVE_MODEL_TEST\
        \ FIREWORKS_API_KEY'''.split()\nfound = sorted(name for name in os.environ if name in names or name.endswith('_API_KEY'))\n\
        if found:\n    raise SystemExit('Credential variables present: ' + ', '.join(found))\nPYTHON\ncargo_home=$(cd\
        \ \"${CARGO_HOME:-$HOME/.cargo}\" && pwd)\nrustup_home=$(cd \"${RUSTUP_HOME:-$HOME/.rustup}\" && pwd)\n\
        diagnostics=\"$PWD/target/browser-author-diagnostics\"\nmkdir -p \"$diagnostics\"\nisolation=$(mktemp -d\
        \ \"$RUNNER_TEMP/maestro-tests.XXXXXX\")\ntrap 'rm -rf \"$isolation\"' EXIT\nmkdir \"$isolation\"/{home,tmp,config,data,cache,state,runtime,config-dirs,data-dirs}\n\
        run_isolated() {\nenv -i PATH=\"${TOOLS:+$TOOLS:}$PATH\" CARGO_HOME=\"$cargo_home\" RUSTUP_HOME=\"$rustup_home\"\
        \ RUSTUP_TOOLCHAIN=\"$RUSTUP_TOOLCHAIN\" \\\n  HOME=\"$isolation/home\" TMPDIR=\"$isolation/tmp\" TMP=\"\
        $isolation/tmp\" TEMP=\"$isolation/tmp\" \\\n  XDG_CONFIG_HOME=\"$isolation/config\" XDG_DATA_HOME=\"$isolation/data\"\
        \ \\\n  XDG_CACHE_HOME=\"$isolation/cache\" XDG_STATE_HOME=\"$isolation/state\" \\\n  XDG_RUNTIME_DIR=\"\
        $isolation/runtime\" XDG_CONFIG_DIRS=\"$isolation/config-dirs\" \\\n  XDG_DATA_DIRS=\"$isolation/data-dirs\"\
        \ MAESTRO_NO_LOCAL_LLM=1 MAESTRO_TEST_DIAGNOSTICS_DIR=\"$diagnostics\" \\\n  CARGO_BUILD_RUSTC_WRAPPER=\"\
        ${CARGO_BUILD_RUSTC_WRAPPER-}\" CARGO_INCREMENTAL=\"${CARGO_INCREMENTAL-}\" \\\n  SCCACHE_DIR=\"${SCCACHE_DIR-}\"\
        \ SCCACHE_CACHE_SIZE=\"${SCCACHE_CACHE_SIZE-}\" \\\n  SCCACHE_LOCAL_RW_MODE=\"${SCCACHE_LOCAL_RW_MODE-}\"\
        \ SCCACHE_GHA_ENABLED=\"${SCCACHE_GHA_ENABLED-}\" \\\n  SCCACHE_SKIP_CACHE_CHECK=\"${SCCACHE_SKIP_CACHE_CHECK-}\"\
        \ SCCACHE_ERROR_LOG=\"${SCCACHE_ERROR_LOG-}\" SCCACHE_LOG=\"${SCCACHE_LOG-}\" \\\n  \"$@\"\n}\ncargo fetch\
        \ --locked\nmapfile -d '' -t packages < <(python3 -c 'import json, os; print(\"\".join(\"-p\\0\" + name\
        \ + \"\\0\" for name in json.loads(os.environ.get(\"TEST_PACKAGES\", \"[]\"))), end=\"\")')\nif [ -z \"\
        ${TEST_PACKAGES:-}\" ]; then packages=(--workspace); fi\nif [ \"${TEST_PACKAGES:-}\" = '[]' ] && [ \"${WARM_CACHE:-false}\"\
        \ != true ]; then exit 0; fi\nif [ \"${SHARD:-}\" != doctests ]; then\n  if [ -n \"${CARGO_COVERAGE_MIN_LINES:-}\"\
        \ ]; then\n    run_isolated \"$TOOLS/cargo-llvm-cov\" llvm-cov --workspace --locked --fail-under-lines \"\
        $CARGO_COVERAGE_MIN_LINES\"\n  elif [ \"${WARM_CACHE:-false}\" = true ] || { [ \"${COLLECT_COVERAGE:-true}\"\
        \ = true ] && [ -n \"${SHARD:-}\" ]; }; then\n    partition=(--partition \"count:$SHARD/$TEST_SHARD_COUNT\"\
        )\n    report=(--lcov --output-path \"$PWD/shard-$SHARD.lcov\")\n    if [ \"${WARM_CACHE:-false}\" = true\
        \ ]; then\n      partition=(-E \"${WARM_TEST_FILTER-none()}\")\n      report=(--no-report)\n    fi\n   \
        \ run_isolated \"$TOOLS/cargo-llvm-cov\" llvm-cov nextest --user-config-file none --ignore-default-filter\
        \ \\\n      --retries 2 --flaky-result pass --final-status-level flaky \"${partition[@]}\" --no-tests pass\
        \ --workspace --locked \"${report[@]}\" 2>&1 | tee nextest.log\n  else\n    partition=()\n    if [ -n \"\
        ${SHARD:-}\" ]; then partition=(--partition \"count:$SHARD/$TEST_SHARD_COUNT\"); fi\n    run_isolated \"\
        $TOOLS/cargo-nextest\" nextest run --user-config-file none --ignore-default-filter \\\n      --locked \"\
        ${packages[@]}\" --retries 2 --flaky-result pass --final-status-level flaky --no-tests pass \"${partition[@]}\"\
        \ 2>&1 | tee nextest.log\n  fi\nfi\nif [[ \"${WARM_CACHE:-false}\" != true && -z \"${CARGO_COVERAGE_MIN_LINES:-}\"\
        \ && ( \"${SHARD:-}\" == doctests || ( \"${SHARD:-1}\" == 1 && \"${COLLECT_COVERAGE:-false}\" != true )\
        \ ) ]]; then\n  run_isolated cargo test --locked --doc \"${packages[@]}\"\nfi\n"
    - name: Print test diagnostics
      id: diagnostics
      if: always() && needs.declaration.outputs.enabled == 'true'
      env:
        CALLER_REPOSITORY: ${{ inputs.checkout-repository || github.repository }}
        CALLER_DIRECTORY: ${{ inputs.working-directory || '.' }}
        CALL_KEY: ${{ inputs.concurrency-key }}
      run: "python3 - <<'PYTHON'\nimport hashlib\nimport json\nimport os\nimport pathlib\nimport secrets\nimport\
        \ sys\nidentity = [os.environ['CALLER_REPOSITORY'], os.environ['CALLER_DIRECTORY'], os.environ['CALL_KEY']]\n\
        digest = hashlib.sha256(json.dumps(identity, ensure_ascii=False, separators=(',', ':')).encode('utf-8')).hexdigest()\n\
        name = f\"test-diagnostics-{os.environ['GITHUB_REPOSITORY_ID']}-{digest}-shard-{os.environ['SHARD']}-run-{os.environ['GITHUB_RUN_ID']}-attempt-{os.environ['GITHUB_RUN_ATTEMPT']}\"\
        \nwith open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:\n    output.write(f'artifact_name={name}\\\
        n')\ntoken = secrets.token_hex(32)\nprint(f'::stop-commands::{token}', flush=True)\ntry:\n    for path in\
        \ pathlib.Path('target/browser-author-diagnostics').rglob('*'):\n        if path.is_file() and not path.is_symlink():\n\
        \            sys.stdout.buffer.write(path.read_bytes())\nfinally:\n    print(f'\\n::{token}::', flush=True)\n\
        PYTHON\n"
    - name: Upload test diagnostics
      if: always() && needs.declaration.outputs.enabled == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.diagnostics.outputs.artifact_name }}
        path: '${{ inputs.working-directory || ''.'' }}/target/browser-author-diagnostics

          ${{ inputs.working-directory || ''.'' }}/nextest.log

          '
        if-no-files-found: ignore
    - name: Flaky test summary
      if: always()
      run: "python3 - <<'PYTHON'\nimport os\nimport pathlib\nimport re\npath = pathlib.Path('nextest.log')\ntext\
        \ = path.read_text(encoding='utf-8') if path.exists() else ''\ntext = re.sub(r'\\x1b\\[[0-9;]*m', '', text)\n\
        flaky = sorted(set(re.findall(r'^\\s*FLAKY(?:\\s+\\d+/\\d+)?\\s+\\[[^]]*\\]\\s*(.+)$', text, re.MULTILINE)))\n\
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:\n    output.write('### Flaky\
