    - name: Embedded check defaults
      run: "python3 - <<'PYTHON'\nimport json\nimport os\nimport pathlib\nimport subprocess\nimport tomllib\nconfig\
        \ = json.loads(os.environ.get('QUALITY_CONFIG') or '{}')\ndirectory = pathlib.Path(os.environ['RUNNER_TEMP'])\
        \ / 'maestro-checks'\ndirectory.mkdir(exist_ok=True)\ndef toml_value(value):\n    return json.dumps(value,\
        \ ensure_ascii=False)\n# BSL-1.0 is the Boost Software License; BUSL-1.1, the Business Source License, is\
        \ absent from the default allowlist.\n# Callers can allow BUSL-1.1 for an exact package version through\
        \ license_exceptions.\nallow = ['MIT', 'Apache-2.0', 'ISC', 'BSD-2-Clause', 'BSD-3-Clause', 'Zlib',\n  \
        \       'Apache-2.0 WITH LLVM-exception', 'Unicode-DFS-2016', 'Unicode-3.0',\n         'CC0-1.0', 'CDLA-Permissive-2.0',\
        \ 'MPL-2.0', 'MIT-0', 'BSL-1.0']\ndeny = '[advisories]\\nyanked = \"deny\"\\n'\nif config.get('advisory_exceptions')\
        \ or config.get('yanked_crate_exceptions'):\n    with pathlib.Path('Cargo.lock').open('rb') as source:\n\
        \        packages = {(entry['name'], entry['version']) for entry in tomllib.load(source)['package']}\n \
        \   for entry in config.get('yanked_crate_exceptions', []):\n        if (entry['package'], entry['version'])\
        \ not in packages:\n            raise SystemExit(f\"Cargo.lock: stale yanked-crate exception for {entry['package']}\
        \ {entry['version']}\")\nif config.get('advisory_exceptions'):\n    for entry in config['advisory_exceptions']:\n\
        \        if (entry['package'], entry['version']) not in packages:\n            raise SystemExit(f\"Cargo.lock:\
        \ stale advisory exception {entry['id']} for {entry['package']} {entry['version']}\")\nif config.get('advisory_exceptions')\
        \ and os.environ.get('CHECK_ADVISORIES') != 'false':\n    declared = {(entry['id'], entry['package'], entry['version'])\
        \ for entry in config['advisory_exceptions']}\n    probe = directory / 'probe-deny.toml'\n    probe.write_text('[advisories]\\\
        nyanked = \"deny\"\\n', encoding=\"utf-8\")\n    found = subprocess.run([os.environ['TOOLS'] + '/cargo-deny',\
        \ '--format', 'json', '--workspace', '--locked', '--all-features',\n                            '--config',\
        \ str(probe), 'check', 'advisories'], capture_output=True, text=True)\n    reported = {}\n    for line in\
        \ found.stderr.splitlines():\n        fields = json.loads(line).get('fields', {}) if line.startswith('{')\
        \ else {}\n        if 'advisory' in fields:\n            reported.setdefault(fields['advisory']['id'], set()).update(\n\
        \                (graph['Krate']['name'], graph['Krate']['version']) for graph in fields['graphs'])\n  \
        \  for entry in config['advisory_exceptions']:\n        if (entry['package'], entry['version']) not in reported.get(entry['id'],\
        \ set()):\n            actual = ', '.join(f'{name} {version}' for name, version in sorted(reported.get(entry['id'],\
        \ ()))) or 'no such finding'\n            raise SystemExit(f\"Cargo.lock: advisory exception {entry['id']}\
        \ is not reported for {entry['package']} {entry['version']}: {actual}\")\n    missing = {(advisory, package,\
        \ version) for advisory in {entry['id'] for entry in config['advisory_exceptions']}\n               for\
        \ package, version in reported.get(advisory, set())} - declared\n    if missing:\n        advisory, package,\
        \ version = sorted(missing)[0]\n        raise SystemExit(f\"Cargo.lock: advisory exception {advisory} is\
        \ missing for {package} {version}\")\nif config.get('advisory_exceptions') or config.get('yanked_crate_exceptions'):\n\
        \    deny += 'ignore = [\\n'\n    for entry in config.get('advisory_exceptions', []):\n        deny += '\
        \  { id = ' + toml_value(entry['id']) + ', reason = ' + toml_value(entry['reason']) + ' },\\n'\n    for\
        \ entry in config.get('yanked_crate_exceptions', []):\n        deny += '  { crate = ' + toml_value(entry['package']\
        \ + '@=' + entry['version']) + ' },\\n'\n    deny += ']\\n'\ndeny += '[licenses]\\nallow = ' + toml_value(allow)\
        \ + '\\n'\nfor entry in config.get('license_exceptions', []):\n    deny += '\\n[[licenses.exceptions]]\\\
        nname = ' + toml_value(entry['package'])\n    deny += '\\nversion = ' + toml_value('=' + entry['version'])\n\
        \    deny += '\\nallow = ' + toml_value(entry['licenses']) + '\\n'\ndeny += '\\n[bans]\\n[sources]\\nunknown-registry\
        \ = \"deny\"\\nunknown-git = \"deny\"\\n'\ndeny += 'allow-git = ' + toml_value(config.get('git_sources',\
        \ [])) + '\\n'\n(directory / 'deny.toml').write_text(deny, encoding=\"utf-8\")\nwords = '[default.extend-words]\\\
        n'\nwords += ''.join(toml_value(word) + ' = ' + toml_value(word) + '\\n' for word in dict.fromkeys(config.get('spelling_words',\
        \ [])))\n(directory / 'typos.toml').write_text(words, encoding=\"utf-8\")\n(directory / 'gitleaks.toml').write_text('[extend]\\\
        nuseDefault = true\\n', encoding=\"utf-8\")\n(directory / 'gitleaks.ignore').write_text('', encoding=\"\
        utf-8\")\n(directory / 'actionlint.yaml').write_text('{}\\n', encoding=\"utf-8\")\nprivileged = config.get('privileged_trigger_workflows',\
        \ [])\nzizmor = {'rules': {'dangerous-triggers': {'ignore': [pathlib.Path(value).name\n          for value\
        \ in privileged]}}} if privileged else {'rules': {}}\n(directory / 'zizmor.yaml').write_text(toml_value(zizmor)\
        \ + '\\n', encoding=\"utf-8\")\nwith open(os.environ['GITHUB_ENV'], 'a', encoding=\"utf-8\") as output:\n\
        \    output.write(f'CHECK_DEFAULTS={directory}\\n')\n    output.write(f'CARGO_COVERAGE_MIN_LINES={config.get(\"\
        coverage_min_lines\", 80)}\\n')\nPYTHON\n"
    - name: Undeclared advisories
      id: scan
      run: "set +e\n\"$TOOLS/cargo-deny\" --format json --workspace --locked --all-features --config \"$CHECK_DEFAULTS/deny.toml\"\
        \ check advisories 2> \"$RUNNER_TEMP/advisories.jsonl\"\nstatus=$?\nset -e\nSTATUS=$status python3 - <<'PYTHON'\n\
        import json\nimport os\nfindings = {}\nfor line in open(os.path.join(os.environ['RUNNER_TEMP'], 'advisories.jsonl'),\
        \ encoding='utf-8'):\n    fields = json.loads(line).get('fields', {}) if line.startswith('{') else {}\n\
        \    if fields.get('severity') != 'error':\n        continue\n    crates = sorted({f\"{graph['Krate']['name']}\
        \ {graph['Krate']['version']}\" for graph in fields.get('graphs', [])})\n    advisory = fields.get('advisory')\n\
        \    # Yanked crates carry no advisory; their code and crates identify them.\n    key = advisory['id'] if\
        \ advisory else f\"{fields.get('code')} {', '.join(crates)}\"\n    finding = findings.setdefault(key, {'id':\
        \ key, 'title': advisory.get('title', '') if advisory else fields.get('message', ''), 'crates': set()})\n\
        \    finding['crates'].update(crates)\nif os.environ['STATUS'] != '0' and not findings:\n    raise SystemExit(f\"\
        cargo-deny exited {os.environ['STATUS']} without an advisory finding\")\nresult = [dict(finding, crates=sorted(finding['crates']))\
        \ for finding in sorted(findings.values(), key=lambda finding: finding['id'])]\nfor finding in result:\n\
        \    print(f\"{finding['id']}: {', '.join(finding['crates'])}: {finding['title']}\")\nprint(f'{len(result)}\
        \ undeclared advisories')\nwith open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:\n  \
        \  output.write('findings=' + json.dumps(result) + '\\n')\nPYTHON\n"
  targets:
    name: Check (${{ matrix.target }})
    needs: declaration
    if: ${{ !inputs.advisory-scan && !inputs.fuzz-scan && (!inputs.warm-cache || github.event_name == 'push') &&
      needs.declaration.outputs.targets != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.declaration.outputs.targets) }}
    runs-on: ${{ matrix.runner == 'ubuntu-latest' && fromJSON(needs.declaration.outputs.linux_runner) || matrix.runner
      }}
    env:
      CACHE_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        repository: ${{ inputs.checkout-repository || github.repository }}
        path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
        ref: ${{ inputs.checkout-ref || github.sha }}
    - name: Toolchain
      run: rustup show
    - name: Compile cache identity
      if: runner.os != 'Windows'
      id: cache-identity
      env: *id001
      run: "python3 - <<'PYTHON'\nimport hashlib\nimport json\nimport os\nimport subprocess\nshape = os.environ['CACHE_JOB']\n\
        if shape == 'tests':\n    coverage = os.environ['CACHE_WARM'] == 'true' or (os.environ['CACHE_ENABLED']\
        \ == 'true' and os.environ['CACHE_COVERAGE'] == 'true' and os.environ.get('SHARD', '') not in ('', 'doctests'))\n\
        \    shape = 'tests-coverage' if coverage else 'tests-plain'\nelif shape == 'targets':\n    shape += '-clippy-'\
        \ + os.environ['CACHE_TARGET']\ncompiler = subprocess.check_output(['rustc', '-vV'], text=True)\nidentity\
        \ = [os.environ[name] for name in ['CALLER_REPOSITORY', 'CALLER_DIRECTORY', 'HOST_OS', 'HOST_ARCH']] + [compiler,\
        \ shape]\ndigest = hashlib.sha256(json.dumps(identity, ensure_ascii=True, separators=(',', ':')).encode('utf-8')).hexdigest()\n\
        prefix = f'maestro-compile-v1-{digest}-'\ncall = hashlib.sha256(os.environ['CACHE_CALL'].encode('utf-8')).hexdigest()\n\
        suffix = '-'.join(os.environ[name] for name in ['GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'CACHE_JOB', 'CACHE_INDEX'])\
        \ + '-' + call\nwriter = os.environ['GITHUB_EVENT_NAME'] == 'push' and os.environ['GITHUB_REF'] == 'refs/heads/'\
        \ + os.environ['CACHE_DEFAULT_BRANCH']\nif os.environ['CACHE_JOB'] == 'tests':\n    shard = os.environ.get('SHARD',\
        \ '')\n    writer = writer and (shard in ('warm', '1') or (shard == 'doctests' and os.environ['CACHE_ENABLED']\
        \ == 'true' and os.environ['CACHE_COVERAGE'] == 'true'))\nwith open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8')\
        \ as output:\n    output.write(f'prefix={prefix}\\nkey={prefix}{suffix}\\nwriter={str(writer).lower()}\\\
        n')\nPYTHON\n"
    - name: Restore compile cache
      if: runner.os != 'Windows'
      id: cache-restore
      continue-on-error: true
      uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
      with: *id002
    - name: Compile cache
      if: runner.os != 'Windows'
      env:
        CACHE_RESTORE_OUTCOME: ${{ steps.cache-restore.outcome }}
        CACHE_RESTORE_MATCHED: ${{ steps.cache-restore.outputs.cache-hit }}
      timeout-minutes: 10
      run: "version=0.18.0\ncase \"$(uname -s):$(uname -m)\" in\n  Linux:x86_64) platform=x86_64-unknown-linux-musl\
        \ digest=45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89 ;;\n  Linux:aarch64) platform=aarch64-unknown-linux-musl\
        \ digest=2b3284d5da3b46a47dc4229e75bb7b88ac4aa99c8d754fb7d2f84997e5a4354a ;;\n  Darwin:arm64) platform=aarch64-apple-darwin\
        \ digest=308184519b646f5125289e8515b36f6ca65a13a041923994aebe702348674e8e ;;\n  *) echo 'Unsupported compile\
        \ cache runner host' >&2; exit 1 ;;\nesac\nname=sccache-v$version-$platform\nbin=$(mktemp -d \"$RUNNER_TEMP/maestro-sccache.XXXXXX\"\
        )\narchive=$(mktemp)\ncurl --fail --retry 3 --location \"https://github.com/mozilla/sccache/releases/download/v$version/$name.tar.gz\"\
        \ --output \"$archive\"\npython3 - \"$digest\" \"$archive\" <<'PYTHON'\nimport hashlib\nimport sys\nwith\
        \ open(sys.argv[2], 'rb') as source:\n    raise SystemExit(hashlib.file_digest(source, 'sha256').hexdigest()\
        \ != sys.argv[1])\nPYTHON\ntar -xzf \"$archive\" -C \"$bin\" --strip-components=1 \"$name/sccache\"\nrm\
        \ \"$archive\"\ntest -x \"$bin/sccache\"\necho \"$bin\" >> \"$GITHUB_PATH\"\nif [ \"$CACHE_RESTORE_OUTCOME\"\
        \ = failure ] || { [ \"$CACHE_RESTORE_MATCHED\" != true ] && [ \"$CACHE_RESTORE_MATCHED\" != false ]; };\
        \ then\n  rm -rf \"$RUNNER_TEMP/maestro-sccache\"\n  echo 'Compile cache snapshot restore failed; using\
        \ an empty local cache'\nfi\nexport SCCACHE_DIR=\"$RUNNER_TEMP/maestro-sccache\" SCCACHE_CACHE_SIZE=1073741824\n\
        export SCCACHE_LOCAL_RW_MODE=READ_WRITE SCCACHE_GHA_ENABLED=false CARGO_INCREMENTAL=0\nexport SCCACHE_SKIP_CACHE_CHECK=true\
        \ SCCACHE_ERROR_LOG=\"$RUNNER_TEMP/sccache-error.log\" SCCACHE_LOG=debug\n{ echo CARGO_BUILD_RUSTC_WRAPPER=sccache;\
        \ env | grep -E '^(SCCACHE_(DIR|CACHE_SIZE|LOCAL_RW_MODE|GHA_ENABLED|SKIP_CACHE_CHECK|ERROR_LOG|LOG)|CARGO_INCREMENTAL)=';\
        \ } >> \"$GITHUB_ENV\"\nPATH=\"$bin:$PATH\" sccache --start-server\n"
    - name: Mise bootstrap
      timeout-minutes: 10
      if: needs.declaration.outputs.test_tools == 'true'
      run: "# https://github.com/jdx/mise/releases/download/v2026.10.2/SHASUMS256.txt\nversion=2026.10.2\nexecutable=mise\n\
        case \"$(uname -s):$(uname -m)\" in\n  Linux:x86_64) platform=linux-x64 digest=8f5f6660336f572830e33cd9b378d3131e529a0d4c4f0c553776be90a1ba302a\
        \ ;;\n  Linux:aarch64) platform=linux-arm64 digest=8d230a5a23ac559ea24ec65280867f437000b37473d967a9bb954837592490a8\
        \ ;;\n  Darwin:arm64) platform=macos-arm64 digest=66d49acecca413c8b334922584982a4907a10588912829873d6c55d0c6d42612\
        \ ;;\n  Darwin:x86_64) platform=macos-x64 digest=1c6b3d4aaeba8d3b8b57e2d06e4b7825a5134b7aa6e97313bd99db6f22bac21f\
        \ ;;\n  MINGW*:x86_64) platform=windows-x64.exe executable=mise.exe digest=15901d0b8e0cfe76c1c3b7de4194f929244f331ca3fdf183c2e3aa17ba31634c\
        \ ;;\n  *) echo 'Unsupported mise runner host' >&2; exit 1 ;;\nesac\nurl=https://github.com/jdx/mise/releases/download/v$version/mise-v$version-$platform\n\
        installed=$(mise --version 2>/dev/null | cut -d ' ' -f 1) || installed=\nif [ \"$installed\" != \"$version\"\
        \ ]; then\n  bin=$(mktemp -d \"$RUNNER_TEMP/maestro-mise.XXXXXX\")\n  curl --fail --retry 3 --location \"\
        $url\" --output \"$bin/$executable\"\n  python3 - \"$digest\" \"$bin/$executable\" <<'PYTHON'\nimport hashlib\n\
        import sys\nwith open(sys.argv[2], 'rb') as source:\n    raise SystemExit(hashlib.file_digest(source, 'sha256').hexdigest()\
        \ != sys.argv[1])\nPYTHON\n  chmod +x \"$bin/$executable\"\n  \"$bin/$executable\" --version | grep \"^$version\
        \ \"\n  export PATH=\"$bin:$PATH\"\n  if [ \"$executable\" = mise.exe ]; then bin=$(cygpath -w \"$bin\"\
        ); fi\n  echo \"$bin\" >> \"$GITHUB_PATH\"\nfi\n"
    - name: Test tools
      timeout-minutes: 10
      if: needs.declaration.outputs.test_tools == 'true'
      run: "if [ ! -f mise.toml ]; then\n  echo 'mise.toml: caller tools require a pinned tool configuration' >&2\n\
        \  exit 1\nfi\nmise install\nmise bin-paths | while IFS= read -r bin; do\n  if [ \"${OS:-}\" = Windows_NT\
        \ ]; then bin=$(cygpath -w \"$bin\"); fi\n  echo \"$bin\" >> \"$GITHUB_PATH\"\ndone\n"
    - name: Check target
      env:
        TARGET: ${{ matrix.target }}
      run: 'rustup target add "$TARGET"

        rustup component add clippy

        cargo clippy --workspace --all-targets --locked --target "$TARGET" -- -D warnings

        '
    - name: Compile cache statistics
      id: cache-statistics
      if: always() && runner.os != 'Windows'
      run: "test \"$CARGO_BUILD_RUSTC_WRAPPER\" = sccache\ntest \"$CARGO_INCREMENTAL\" = 0\nsccache --show-stats\
        \ | tee \"$RUNNER_TEMP/sccache-stats\"\nif grep -Eq '^Cache write errors +[1-9][0-9]*' \"$RUNNER_TEMP/sccache-stats\"\
        ; then\n  echo write_errors=true >> \"$GITHUB_OUTPUT\"\nelse\n  echo write_errors=false >> \"$GITHUB_OUTPUT\"\
        \nfi\nif [ -f \"$RUNNER_TEMP/sccache-error.log\" ]; then\n  token=$(python3 -c 'import secrets; print(secrets.token_hex(32))')\n\
        \  echo \"::stop-commands::$token\"\n  cat \"$RUNNER_TEMP/sccache-error.log\"\n  printf '\\n::%s::\\n' \"\
        $token\"\nfi\n"
    - name: Upload compile cache errors
      if: always() && (steps.cache-statistics.outputs.write_errors == 'true' || (inputs.concurrency-key == 'maestro-proof'
        && steps.cache-statistics.outcome == 'success'))
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with: *id003
    - name: Seal compile cache
      if: runner.os != 'Windows'
      id: cache-seal
      run: "if ! sccache --stop-server; then\n  echo 'Compile cache snapshot save skipped: server stop failed'\n\
        \  exit 0\nfi\npython3 - <<'PYTHON'\nimport os\nimport pathlib\nimport stat\nfiles = size = 0\ntry:\n  \
        \  def failed(error):\n        raise error\n    for directory, _, names in os.walk(os.environ['SCCACHE_DIR'],\
        \ onerror=failed):\n        for name in names:\n            metadata = pathlib.Path(directory, name).lstat()\n\
        \            if stat.S_ISREG(metadata.st_mode):\n                files += 1\n                size += metadata.st_size\n\
        except OSError:\n    print('Compile cache snapshot save skipped: cache inspection failed')\nelse:\n    print(f'Compile\
        \ cache snapshot: {files} files, {size} bytes')\n    if not files or not size:\n        print('Compile cache\
        \ snapshot save skipped: empty cache')\n    elif size > 1073741824:\n        print('Compile cache snapshot\
        \ save skipped: exceeds 1073741824 bytes')\n    else:\n        with open(os.environ['GITHUB_OUTPUT'], 'a',\
        \ encoding='utf-8') as output:\n            output.write('eligible=true\\n')\nPYTHON\n"
  browser:
    name: Wasm and browser build
    needs: declaration
    if: ${{ needs.declaration.outputs.coverage == 'true' && !inputs.advisory-scan && !inputs.fuzz-scan && !inputs.warm-cache
