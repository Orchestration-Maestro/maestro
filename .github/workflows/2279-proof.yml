        \ in range(start, len(lines)) if lines[i].startswith('SUMMARY: ')), len(lines))\nout = pathlib.Path(os.environ['RUNNER_TEMP'])\
        \ / 'fuzz-finding'\nout.mkdir()\nshutil.copyfile(raw, out / raw.name)\nshutil.copyfile(minimized, out /\
        \ 'minimized')\n(out / 'fuzz.log').write_text(run.stdout, encoding='utf-8')\n(out / 'tmin.log').write_text(tmin.stdout,\
        \ encoding='utf-8')\n(out / 'finding.json').write_text(json.dumps({\n    'target': target, 'kind': raw.name.split('-',\
