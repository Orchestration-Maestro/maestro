        PYTHON\n"
    - name: Compile cache statistics
      id: cache-statistics
      if: always()
      run: "test \"$CARGO_BUILD_RUSTC_WRAPPER\" = sccache\ntest \"$CARGO_INCREMENTAL\" = 0\nsccache --show-stats\
        \ | tee \"$RUNNER_TEMP/sccache-stats\"\nif grep -Eq '^Cache write errors +[1-9][0-9]*' \"$RUNNER_TEMP/sccache-stats\"\
