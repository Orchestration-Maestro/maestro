name: Pr Gate
on:
  pull_request_target:
    types: [opened]
permissions: {}
jobs:
  policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      TZ: UTC
      CARGO_BUILD_JOBS: '3'
    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Build trusted policy
        run: |
          rustup show active-toolchain
          cargo build -p maestro-test-conventions --bin repository_policy --locked
      - name: Apply repository policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: target/debug/repository_policy pr-gate
