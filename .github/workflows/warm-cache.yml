name: Compile cache warm-up
"on":
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: warm-cache-${{ github.ref }}
  cancel-in-progress: true
jobs:
  warm:
    name: Warm compile cache
    # Moves with the release re-pin of the required checks (docs/development.md).
    uses: Orchestration-Maestro/maestro-rust-workflows/.github/workflows/ci.yml@52704c40d6696ecb019fedf5918443b0c0360b62 # v0.15.5
    with:
      warm-cache: true
