name: Compile cache warm-up
"on":
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: warm-cache-${{ github.ref }}
  cancel-in-progress: true
jobs:
  warm:
    name: Warm compile cache
    # Moves with the release re-pin of the required checks (docs/development.md).
    uses: Orchestration-Maestro/maestro-rust-workflows/.github/workflows/ci.yml@d14afde109f3a431bd3e82ff14c303d67ddaef06 # v0.12.0
    with:
      warm-cache: true
