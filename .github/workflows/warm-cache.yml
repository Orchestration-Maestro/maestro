name: Compile cache warm-up
"on":
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: warm-cache-${{ github.ref }}
  cancel-in-progress: true
jobs:
  warm:
    name: Warm compile cache
    # Moves with the release re-pin of the required checks (docs/development.md).
    uses: Orchestration-Maestro/maestro-rust-workflows/.github/workflows/ci.yml@be12ba727a7870cd044f6e29cedddeb3d7f709cc # v0.15.6
    with:
      warm-cache: true
