name: Compile cache warm-up
"on":
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: warm-cache-${{ github.ref }}
  cancel-in-progress: true
jobs:
  warm:
    name: Warm compile cache
    # Moves with the release re-pin of the required checks (docs/development.md).
    uses: Orchestration-Maestro/maestro-rust-workflows/.github/workflows/ci.yml@32e1441d7a00c504c3cd18da26fe08fc620e0019 # v0.18.0
    with:
      warm-cache: true
