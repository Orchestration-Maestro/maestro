name: Compile cache warm-up
"on":
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: warm-cache-${{ github.ref }}
  cancel-in-progress: true
jobs:
  warm:
    name: Warm compile cache
    # Moves with the release re-pin of the required checks (docs/development.md).
    uses: Orchestration-Maestro/maestro-rust-workflows/.github/workflows/ci.yml@dc0bd07144409914dc0f2b577a119c525b815b70 # v0.15.4
    with:
      warm-cache: true
