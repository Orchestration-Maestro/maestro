name: Compile cache warm-up
"on":
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: warm-cache-${{ github.ref }}
  cancel-in-progress: true
jobs:
  warm:
    name: Warm compile cache
    # Moves with the release re-pin of the required checks (docs/development.md).
    uses: Orchestration-Maestro/maestro-rust-workflows/.github/workflows/ci.yml@91570058e21c7b5458cf7e4852d2a6518a08ed95 # v0.18.1
    with:
      warm-cache: true
