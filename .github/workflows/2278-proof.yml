name: Truncated search example proof
on:
  push:
    branches: ['ci/2278-proof-*']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      NEXTEST_TEST_THREADS: '3'
      RUST_TEST_THREADS: '3'
      SCCACHE_GHA_ENABLED: 'false'
      SCCACHE_DIR: /tmp/maestro-sccache
      SCCACHE_CACHE_SIZE: '1073741824'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Toolchain and cache identity
        id: cache
        shell: bash
        run: |
          rustup show
          rustup target add wasm32-wasip2
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          compiler = subprocess.check_output(['rustc', '-vV'], text=True)
          identity = [os.environ['GITHUB_REPOSITORY'], '.', 'Linux', 'X64', compiler, 'tests-plain']
          digest = hashlib.sha256(json.dumps(identity, ensure_ascii=True, separators=(',', ':')).encode()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'prefix=maestro-compile-v1-{digest}-\n')
          PY
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: /tmp/maestro-sccache
          key: ${{ steps.cache.outputs.prefix }}proof-${{ github.run_id }}
          restore-keys: ${{ steps.cache.outputs.prefix }}
      - name: Install checked test tools
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec "$@"\n' > "$HOME/.local/bin/capped"
          chmod +x "$HOME/.local/bin/capped"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl --fail --retry 3 -L https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/cargo-nextest-0.9.148-x86_64-unknown-linux-musl.tar.gz -o /tmp/nextest.tar.gz
          echo 'bf92cb81450872d960ffa13857a83084d557ec0cdc141663d263bb23ef756f97  /tmp/nextest.tar.gz' | sha256sum -c
          tar -xzf /tmp/nextest.tar.gz -C "$HOME/.local/bin" cargo-nextest
          curl --fail --retry 3 -L https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/sccache.tar.gz
          echo '45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89  /tmp/sccache.tar.gz' | sha256sum -c
          tar -xzf /tmp/sccache.tar.gz -C "$HOME/.local/bin" --strip-components=1 sccache-v0.18.0-x86_64-unknown-linux-musl/sccache
          echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"
      - name: Controlled search execution and private artifacts
        run: ~/.local/bin/capped cargo nextest run --locked -p maestro-extensions-wasm -p maestro-extensions-wasmtime -p maestro-extensions --no-fail-fast -- truncated_tool_ temporary_directories_are_private_and_distinct
      - name: Shipped example index and standalone copy
        run: |
          ~/.local/bin/capped cargo nextest run --locked -p maestro-app --test integration -- shipped_examples
          ~/.local/bin/capped cargo nextest run --locked -p maestro-tooling --test integration -- maestro_standalone_assets_preserve_recursive_layout
      - name: Native Clippy, component build and strict documentation
        run: |
          ~/.local/bin/capped cargo clippy --locked -p maestro-tools -p maestro-extensions -p maestro-extensions-wasm -p maestro-extensions-wasmtime --all-targets -- -D warnings
          ~/.local/bin/capped cargo build --locked -p maestro-extensions-wasm --target wasm32-wasip2 --example truncated_tool --release
          RUSTDOCFLAGS='-D warnings -D missing_docs' ~/.local/bin/capped cargo doc --locked -p maestro-tools -p maestro-extensions -p maestro-extensions-wasm -p maestro-extensions-wasmtime --no-deps
          ~/.local/bin/capped cargo test --locked -p maestro-tools -p maestro-extensions -p maestro-extensions-wasm -p maestro-extensions-wasmtime --doc
      - name: Cache statistics (no cache save)
        if: always()
        run: sccache --show-stats
