name: Shortcut documentation proof
on:
  push:
    branches: ['ci/2835-proof-*']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      NEXTEST_TEST_THREADS: '3'
      RUST_TEST_THREADS: '3'
      SCCACHE_GHA_ENABLED: 'false'
      SCCACHE_DIR: /tmp/maestro-sccache
      SCCACHE_CACHE_SIZE: '1073741824'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Toolchain and cache identity
        id: cache
        shell: bash
        run: |
          rustup show
          rustup target add wasm32-wasip2
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          compiler = subprocess.check_output(['rustc', '-vV'], text=True)
          identity = [os.environ['GITHUB_REPOSITORY'], '.', 'Linux', 'X64', compiler, 'tests-plain']
          digest = hashlib.sha256(json.dumps(identity, ensure_ascii=True, separators=(',', ':')).encode()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'prefix=maestro-compile-v1-{digest}-\n')
          PY
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: /tmp/maestro-sccache
          key: ${{ steps.cache.outputs.prefix }}proof-${{ github.run_id }}
          restore-keys: ${{ steps.cache.outputs.prefix }}
      - name: Install checked test tools
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec "$@"\n' > "$HOME/.local/bin/capped"
          chmod +x "$HOME/.local/bin/capped"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl --fail --retry 3 -L https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/cargo-nextest-0.9.148-x86_64-unknown-linux-musl.tar.gz -o /tmp/nextest.tar.gz
          echo 'bf92cb81450872d960ffa13857a83084d557ec0cdc141663d263bb23ef756f97  /tmp/nextest.tar.gz' | sha256sum -c
          tar -xzf /tmp/nextest.tar.gz -C "$HOME/.local/bin" cargo-nextest
          curl --fail --retry 3 -L https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/sccache.tar.gz
          echo '45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89  /tmp/sccache.tar.gz' | sha256sum -c
          tar -xzf /tmp/sccache.tar.gz -C "$HOME/.local/bin" --strip-components=1 sccache-v0.18.0-x86_64-unknown-linux-musl/sccache
          echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"
      - name: Mise bootstrap
        shell: bash
        run: |
          # https://github.com/jdx/mise/releases/download/v2026.10.2/SHASUMS256.txt
          version=2026.10.2
          executable=mise
          case "$(uname -s):$(uname -m)" in
            Linux:x86_64) platform=linux-x64 digest=8f5f6660336f572830e33cd9b378d3131e529a0d4c4f0c553776be90a1ba302a ;;
            Linux:aarch64) platform=linux-arm64 digest=8d230a5a23ac559ea24ec65280867f437000b37473d967a9bb954837592490a8 ;;
            Darwin:arm64) platform=macos-arm64 digest=66d49acecca413c8b334922584982a4907a10588912829873d6c55d0c6d42612 ;;
            Darwin:x86_64) platform=macos-x64 digest=1c6b3d4aaeba8d3b8b57e2d06e4b7825a5134b7aa6e97313bd99db6f22bac21f ;;
            MINGW*:x86_64) platform=windows-x64.exe executable=mise.exe digest=15901d0b8e0cfe76c1c3b7de4194f929244f331ca3fdf183c2e3aa17ba31634c ;;
            *) echo 'Unsupported mise runner host' >&2; exit 1 ;;
          esac
          url=https://github.com/jdx/mise/releases/download/v$version/mise-v$version-$platform
          installed=$(mise --version 2>/dev/null | cut -d ' ' -f 1) || installed=
          if [ "$installed" != "$version" ]; then
            bin=$(mktemp -d "$RUNNER_TEMP/maestro-mise.XXXXXX")
            curl --fail --retry 3 --location "$url" --output "$bin/$executable"
            python3 - "$digest" "$bin/$executable" <<'PYTHON'
          import hashlib
          import sys
          with open(sys.argv[2], 'rb') as source:
              raise SystemExit(hashlib.file_digest(source, 'sha256').hexdigest() != sys.argv[1])
          PYTHON
            chmod +x "$bin/$executable"
            "$bin/$executable" --version | grep "^$version "
            export PATH="$bin:$PATH"
            if [ "$executable" = mise.exe ]; then bin=$(cygpath -w "$bin"); fi
            echo "$bin" >> "$GITHUB_PATH"
          fi
      - name: Test tools
        shell: bash
        run: |
          if [ ! -f mise.toml ]; then
            echo 'mise.toml: caller tools require a pinned tool configuration' >&2
            exit 1
          fi
          mise install
          mise bin-paths | while IFS= read -r bin; do
            if [ "${OS:-}" = Windows_NT ]; then bin=$(cygpath -w "$bin"); fi
            echo "$bin" >> "$GITHUB_PATH"
          done
      - name: Search tools
        shell: bash
        run: |
          # Digests: ripgrep's release .sha256 file and fd's GitHub release asset digest.
          bin=$(mktemp -d "$RUNNER_TEMP/maestro-search-bin.XXXXXX")
          while read -r url digest binary; do
            archive=$(mktemp)
            curl --fail --retry 3 --location "$url" --output "$archive"
            printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --status
            unpack=$(mktemp -d)
            tar -xzf "$archive" -C "$unpack"
            find "$unpack" -type f -name "$binary" -exec cp '{}' "$bin/$binary" \;
            test -x "$bin/$binary"
            rm -rf "$archive" "$unpack"
          done <<'TOOLS'
          https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c rg
          https://github.com/sharkdp/fd/releases/download/v10.5.0/fd-v10.5.0-x86_64-unknown-linux-musl.tar.gz 761c72dc8e120d85b22292063be8a796e2eeb20eb3e4f38b8fa2343ccf3514a7 fd
          TOOLS
          "$bin/rg" --version
          "$bin/fd" --version
          echo "$bin" >> "$GITHUB_PATH"
      - name: Workspace Clippy
        shell: bash
        run: |
          set -o pipefail
          ~/.local/bin/capped cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee clippy.log
      - name: Strict workspace rustdoc
        shell: bash
        if: always()
        run: |
          set -o pipefail
          RUSTDOCFLAGS='-D warnings -D missing_docs' ~/.local/bin/capped cargo doc --workspace --no-deps --locked 2>&1 | tee rustdoc.log
      - name: Focused shortcut tests
        shell: bash
        if: always()
        run: |
          set -o pipefail
          ~/.local/bin/capped cargo nextest run --locked -p maestro-tui -p maestro-app -p maestro-chat -E 'test(keybinding) | test(reload) | test(hotkeys) | test(suspend)' 2>&1 | tee focused.log
      - name: Owner crate tests
        shell: bash
        if: always()
        run: |
          set -o pipefail
          ~/.local/bin/capped cargo nextest run --locked -p maestro-tui -p maestro-app -p maestro-chat 2>&1 | tee tests.log
          ~/.local/bin/capped cargo test --locked -p maestro-tui -p maestro-app -p maestro-chat --doc 2>&1 | tee doctests.log
      - name: Upload proof logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shortcut-documentation-proof
          path: '*.log'
          if-no-files-found: ignore
