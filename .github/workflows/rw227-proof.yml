name: Controlled landing safeguard proof

on:
  push:
    branches: [ci/rw227-proof]

permissions:
  contents: read
  actions: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Controlled passing landing
        shell: python
        run: |
          print('PASS controlled_landing_success', flush=True)
          assert True
  report:
    needs: tests
    if: always() && needs.tests.result == 'failure'
    uses: Orchestration-Maestro/maestro-rust-workflows/.github/workflows/post-landing.yml@d1c8270bbd2f577f0724f6a98903fdf478e34511
    with:
      run-id: ${{ github.run_id }}
      proof: true
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
