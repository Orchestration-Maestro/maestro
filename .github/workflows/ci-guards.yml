name: CI speed guards

on:
  workflow_run:
    # The guards read the job names a reusable caller prefixes with its own job name, so a watched
    # workflow this repository declares must call the shared CI. Merge groups and pull requests run
    # `Rust CI`; the full suite after landing alone runs the macOS shards a landing judges.
    workflows: [Rust CI, Full suite after landing]
    types: [completed]
  pull_request:

jobs:
  guards:
    # The shared workflow declares its own job permissions and GitHub reads them when the run loads,
    # before this condition, so the call grants them on both events.
    if: >-
      github.event_name == 'pull_request' ||
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'merge_group' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    permissions:
      contents: read
      actions: read
      issues: write
    uses: Orchestration-Maestro/maestro-rust-workflows/.github/workflows/ci-guards.yml@d6e78953b1196e9e3c6a8c5994730f7c0a4721c7 # v0.19.36
    with:
      run-id: ${{ format('{0}', github.event.workflow_run.id) }}
