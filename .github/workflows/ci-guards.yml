name: CI speed guards

on:
  workflow_run:
    # Merge groups run "Rust CI"; default-branch pushes run the suite after landing, and only
    # those runs save the compile snapshots every other run restores.
    workflows: [Rust CI, Full suite after landing]
    types: [completed]
  pull_request:

jobs:
  guards:
    if: >-
      github.event.workflow_run.event == 'merge_group' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    permissions:
      contents: read
      actions: read
      issues: write
    uses: Orchestration-Maestro/maestro-rust-workflows/.github/workflows/ci-guards.yml@76b0ea5609eb332ca30e63e3aadddae810c39dfe # v0.19.14
    with:
      run-id: ${{ format('{0}', github.event.workflow_run.id) }}

  exceptions:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
    uses: Orchestration-Maestro/maestro-rust-workflows/.github/workflows/ci-guards.yml@76b0ea5609eb332ca30e63e3aadddae810c39dfe # v0.19.14
