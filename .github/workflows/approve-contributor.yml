name: Approve Contributor
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [closed]
permissions: {}
jobs:
  policy:
    if: >-
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      startsWith(github.event.pull_request.head.ref, 'chore/approve-contributor-'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TZ: UTC
      CARGO_BUILD_JOBS: '3'
    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Build trusted policy
        run: |
          rustup show active-toolchain
          cargo build -p maestro-test-conventions --bin repository_policy --locked
      - name: Scoped approval credentials
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Apply repository policy
        id: update
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MAESTRO_APPROVAL_APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: target/debug/repository_policy approve-contributor
