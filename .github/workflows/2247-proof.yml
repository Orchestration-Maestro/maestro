name: Overlay demo proof
"on":
  push:
    branches: ['ci/2247-proof-*']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      NEXTEST_TEST_THREADS: '3'
      RUST_TEST_THREADS: '3'
      SCCACHE_GHA_ENABLED: 'false'
      SCCACHE_DIR: /tmp/maestro-sccache
      SCCACHE_CACHE_SIZE: '1073741824'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Toolchain and cache identity
        id: cache
        shell: bash
        run: |
          git rev-parse HEAD
          rustup show
          rustup target add wasm32-wasip2
          toolchain=$(rustup show active-toolchain)
          echo "RUSTUP_TOOLCHAIN=${toolchain%% *}" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          compiler = subprocess.check_output(['rustc', '-vV'], text=True)
          identity = [os.environ['GITHUB_REPOSITORY'], '.', 'Linux', 'X64', compiler, 'tests-plain']
          digest = hashlib.sha256(json.dumps(identity, ensure_ascii=True, separators=(',', ':')).encode()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'prefix=maestro-compile-v1-{digest}-\n')
          PY
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: /tmp/maestro-sccache
          key: ${{ steps.cache.outputs.prefix }}proof-${{ github.run_id }}
          restore-keys: ${{ steps.cache.outputs.prefix }}
      - name: Install checked test tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep fd-find
          mkdir -p "$HOME/.local/bin"
          ln -s "$(command -v fdfind)" "$HOME/.local/bin/fd"
          printf '#!/bin/sh\nexec "$@"\n' > "$HOME/.local/bin/capped"
          chmod +x "$HOME/.local/bin/capped"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl --fail --retry 3 -L https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/cargo-nextest-0.9.148-x86_64-unknown-linux-musl.tar.gz -o /tmp/nextest.tar.gz
          echo 'bf92cb81450872d960ffa13857a83084d557ec0cdc141663d263bb23ef756f97  /tmp/nextest.tar.gz' | sha256sum -c
          tar -xzf /tmp/nextest.tar.gz -C "$HOME/.local/bin" cargo-nextest
          curl --fail --retry 3 -L https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/sccache.tar.gz
          echo '45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89  /tmp/sccache.tar.gz' | sha256sum -c
          tar -xzf /tmp/sccache.tar.gz -C "$HOME/.local/bin" --strip-components=1 sccache-v0.18.0-x86_64-unknown-linux-musl/sccache
          echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"
      - name: Example Clippy, strict documentation and build
        shell: bash
        run: |
          mkdir -p target/2247-proof
          ~/.local/bin/capped cargo clippy --locked -p maestro-extensions-wasm --target wasm32-wasip2 --example overlay_test --release -- -D warnings 2>&1 | tee target/2247-proof/clippy-component.log
          RUSTDOCFLAGS='-D warnings -D missing_docs' ~/.local/bin/capped cargo doc --locked -p maestro-extensions-wasm --target wasm32-wasip2 --example overlay_test --no-deps 2>&1 | tee target/2247-proof/rustdoc-component.log
          ~/.local/bin/capped cargo build --locked -p maestro-extensions-wasm --target wasm32-wasip2 --example overlay_test --release 2>&1 | tee target/2247-proof/build.log
      - name: Full workspace suite
        shell: bash
        run: |
          set -o pipefail
          isolation=$(mktemp -d "$RUNNER_TEMP/maestro-overlay_test.XXXXXX")
          trap 'rm -rf "$isolation"' EXIT
          cargo_home=$(cd "${CARGO_HOME:-$HOME/.cargo}" && pwd)
          rustup_home=$(cd "${RUSTUP_HOME:-$HOME/.rustup}" && pwd)
          mkdir -p "$isolation"/{home,tmp,config,data,cache,state,runtime,config-dirs,data-dirs}
          env -i PATH="$PATH" CARGO_HOME="$cargo_home" RUSTUP_HOME="$rustup_home" RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" \
            HOME="$isolation/home" TMPDIR="$isolation/tmp" TMP="$isolation/tmp" TEMP="$isolation/tmp" \
            XDG_CONFIG_HOME="$isolation/config" XDG_DATA_HOME="$isolation/data" XDG_CACHE_HOME="$isolation/cache" \
            XDG_STATE_HOME="$isolation/state" XDG_RUNTIME_DIR="$isolation/runtime" XDG_CONFIG_DIRS="$isolation/config-dirs" XDG_DATA_DIRS="$isolation/data-dirs" \
            MAESTRO_NO_LOCAL_LLM=1 CARGO_BUILD_JOBS=3 NEXTEST_TEST_THREADS=3 RUST_TEST_THREADS=3 CARGO_INCREMENTAL=0 \
            RUSTC_WRAPPER=sccache SCCACHE_DIR="$SCCACHE_DIR" SCCACHE_CACHE_SIZE="$SCCACHE_CACHE_SIZE" SCCACHE_GHA_ENABLED=false \
            "$HOME/.local/bin/capped" cargo nextest run --locked --workspace --no-fail-fast 2>&1 | tee target/2247-proof/workspace-tests.log
      - name: Cache statistics
        if: always()
        run: sccache --show-stats
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: overlay_test-proof
          path: target/2247-proof
