name: Failed landing reports

on:
  workflow_run:
    workflows: [Full suite after landing]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  report:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'success'
    uses: Orchestration-Maestro/maestro-rust-workflows/.github/workflows/post-landing.yml@f0330070be52d401b088cf9c91d00ae0e783fc27 # v0.19.8
    with:
      run-id: ${{ format('{0}', github.event.workflow_run.id) }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
