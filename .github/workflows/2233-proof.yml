name: Session handoff example proof
on:
  push:
    branches: ['ci/2233-proof-*']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      NEXTEST_TEST_THREADS: '3'
      RUST_TEST_THREADS: '3'
      SCCACHE_GHA_ENABLED: 'false'
      SCCACHE_DIR: /tmp/maestro-sccache
      SCCACHE_CACHE_SIZE: '1073741824'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Toolchain and cache identity
        id: cache
        shell: bash
        run: |
          rustup show
          rustup target add wasm32-wasip2
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          compiler = subprocess.check_output(['rustc', '-vV'], text=True)
          identity = [os.environ['GITHUB_REPOSITORY'], '.', 'Linux', 'X64', compiler, 'tests-plain']
          digest = hashlib.sha256(json.dumps(identity, ensure_ascii=True, separators=(',', ':')).encode()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'prefix=maestro-compile-v1-{digest}-\n')
          PY
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: /tmp/maestro-sccache
          key: ${{ steps.cache.outputs.prefix }}proof-${{ github.run_id }}
          restore-keys: ${{ steps.cache.outputs.prefix }}
      - name: Install checked test tools
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec "$@"\n' > "$HOME/.local/bin/capped"
          chmod +x "$HOME/.local/bin/capped"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl --fail --retry 3 -L https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/cargo-nextest-0.9.148-x86_64-unknown-linux-musl.tar.gz -o /tmp/nextest.tar.gz
          echo 'bf92cb81450872d960ffa13857a83084d557ec0cdc141663d263bb23ef756f97  /tmp/nextest.tar.gz' | sha256sum -c
          tar -xzf /tmp/nextest.tar.gz -C "$HOME/.local/bin" cargo-nextest
          curl --fail --retry 3 -L https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/sccache.tar.gz
          echo '45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89  /tmp/sccache.tar.gz' | sha256sum -c
          tar -xzf /tmp/sccache.tar.gz -C "$HOME/.local/bin" --strip-components=1 sccache-v0.18.0-x86_64-unknown-linux-musl/sccache
          echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"
      - name: Mise bootstrap
        shell: bash
        run: |
          # https://github.com/jdx/mise/releases/download/v2026.10.2/SHASUMS256.txt
          version=2026.10.2
          executable=mise
          case "$(uname -s):$(uname -m)" in
            Linux:x86_64) platform=linux-x64 digest=8f5f6660336f572830e33cd9b378d3131e529a0d4c4f0c553776be90a1ba302a ;;
            Linux:aarch64) platform=linux-arm64 digest=8d230a5a23ac559ea24ec65280867f437000b37473d967a9bb954837592490a8 ;;
            Darwin:arm64) platform=macos-arm64 digest=66d49acecca413c8b334922584982a4907a10588912829873d6c55d0c6d42612 ;;
            Darwin:x86_64) platform=macos-x64 digest=1c6b3d4aaeba8d3b8b57e2d06e4b7825a5134b7aa6e97313bd99db6f22bac21f ;;
            MINGW*:x86_64) platform=windows-x64.exe executable=mise.exe digest=15901d0b8e0cfe76c1c3b7de4194f929244f331ca3fdf183c2e3aa17ba31634c ;;
            *) echo 'Unsupported mise runner host' >&2; exit 1 ;;
          esac
          url=https://github.com/jdx/mise/releases/download/v$version/mise-v$version-$platform
          installed=$(mise --version 2>/dev/null | cut -d ' ' -f 1) || installed=
          if [ "$installed" != "$version" ]; then
            bin=$(mktemp -d "$RUNNER_TEMP/maestro-mise.XXXXXX")
            curl --fail --retry 3 --location "$url" --output "$bin/$executable"
            python3 - "$digest" "$bin/$executable" <<'PYTHON'
          import hashlib
          import sys
          with open(sys.argv[2], 'rb') as source:
              raise SystemExit(hashlib.file_digest(source, 'sha256').hexdigest() != sys.argv[1])
          PYTHON
            chmod +x "$bin/$executable"
            "$bin/$executable" --version | grep "^$version "
            export PATH="$bin:$PATH"
            if [ "$executable" = mise.exe ]; then bin=$(cygpath -w "$bin"); fi
            echo "$bin" >> "$GITHUB_PATH"
          fi
      - name: Test tools
        shell: bash
        run: |
          if [ ! -f mise.toml ]; then
            echo 'mise.toml: caller tools require a pinned tool configuration' >&2
            exit 1
          fi
          mise install
          mise bin-paths | while IFS= read -r bin; do
            if [ "${OS:-}" = Windows_NT ]; then bin=$(cygpath -w "$bin"); fi
            echo "$bin" >> "$GITHUB_PATH"
          done
      - name: Request blocks red evidence
        shell: bash
        run: |
          mkdir -p proof
          cp examples/extensions/handoff.rs /tmp/handoff-green.rs
          trap 'cp /tmp/handoff-green.rs examples/extensions/handoff.rs' EXIT
          python3 - <<'PYTHON'
          from pathlib import Path
          path = Path('examples/extensions/handoff.rs')
          source = path.read_text()
          block = """content: UserContent::Blocks(vec![UserBlock::Text(TextContent {
                              text,
                              text_signature: None,
                          })]),"""
          assert source.count(block) == 1
          path.write_text(source.replace(block, 'content: UserContent::Text(text),', 1))
          PYTHON
          set +e
          set -o pipefail
          ~/.local/bin/capped cargo nextest run --locked -p maestro-extensions-wasmtime --test integration -- handoff_reviews_draft_and_uses_replacement_context 2>&1 | tee proof/handoff_reviews_draft_and_uses_replacement_context-red.log
          status=${PIPESTATUS[0]}
          set -e
          echo "Exit: $status" >> proof/handoff_reviews_draft_and_uses_replacement_context-red.log
          test "$status" = 100
      - name: Handoff green evidence
        shell: bash
        run: |
          set -o pipefail
          ~/.local/bin/capped cargo nextest run --locked -p maestro-extensions-wasmtime --test integration -- handoff_reviews_draft_and_uses_replacement_context 2>&1 | tee proof/handoff_reviews_draft_and_uses_replacement_context-green.log
          ~/.local/bin/capped cargo nextest run --locked -p maestro-extensions-wasm -p maestro-extensions-wasmtime 2>&1 | tee proof/crate-tests.log
      - name: Index and standalone copy
        shell: bash
        run: |
          set -o pipefail
          ~/.local/bin/capped cargo nextest run --locked -p maestro-app --test integration -- shipped_examples 2>&1 | tee proof/shipped-examples.log
          ~/.local/bin/capped cargo nextest run --locked -p maestro-tooling --test integration -- maestro_standalone_assets_preserve_recursive_layout 2>&1 | tee proof/standalone.log
      - name: Component checks and strict docs
        shell: bash
        run: |
          set -o pipefail
          ~/.local/bin/capped cargo build --locked -p maestro-extensions-wasm --example handoff --target wasm32-wasip2 --release 2>&1 | tee proof/build.log
          ~/.local/bin/capped cargo clippy --locked -p maestro-extensions-wasm --example handoff --target wasm32-wasip2 -- -D warnings 2>&1 | tee proof/clippy-component.log
          RUSTDOCFLAGS='-D warnings -D missing_docs' ~/.local/bin/capped cargo doc --locked -p maestro-extensions-wasm --example handoff --target wasm32-wasip2 --no-deps 2>&1 | tee proof/rustdoc-component.log
          ~/.local/bin/capped cargo test --locked -p maestro-extensions-wasm -p maestro-extensions-wasmtime --doc 2>&1 | tee proof/doctests.log
      - name: Workspace checks
        shell: bash
        run: |
          set -o pipefail
          ~/.local/bin/capped mise exec -- just check 2>&1 | tee proof/just-check.log
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 2233-proof
          path: proof
          retention-days: 7
