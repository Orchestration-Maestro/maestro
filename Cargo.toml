[workspace]
members = ["crates/*"]
exclude = ["vendor/yaml-rust2", "vendor/hayro-interpret"]
resolver = "3"

[workspace.dependencies]
maestro-dependencies = { path = "crates/maestro-dependencies" }
maestro-test-process = { path = "crates/maestro-test-process" }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }
num-bigint = "=0.4.8"
num-traits = "=0.2.19"
yaml-rust2 = { version = "=0.13.0", default-features = false }
ryu-js = "=1.0.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip"] }

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Orchestration-Maestro/maestro"

[workspace.lints.rust]
unsafe_code = "forbid"
forbidden_lint_groups = "forbid"

[workspace.lints.clippy]
pedantic = { level = "forbid", priority = -1 }
missing_docs_in_private_items = "forbid"
redundant_clone = "forbid"
too_many_arguments = "forbid"
fn_params_excessive_bools = "forbid"
too_many_lines = "forbid"
cognitive_complexity = "forbid"
excessive_nesting = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[patch.crates-io]
hayro-interpret = { path = "vendor/hayro-interpret" }
yaml-rust2 = { path = "vendor/yaml-rust2" }

[profile.dev]
debug = "line-tables-only"

# Backtraces need file:line for workspace code only; dependency line tables take target space.
[profile.dev.package."*"]
debug = false

# Tests compile extension components; an unoptimised code generator makes each compile about five times slower.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.test]
debug = "line-tables-only"
