[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
oxc_allocator = { version = "=0.157.0", default-features = false }
oxc_parser = { version = "=0.157.0", default-features = false }
oxc_span = { version = "=0.157.0", default-features = false }
oxc_ast = { version = "=0.157.0", default-features = false }
oxc_ast_visit = { version = "=0.157.0", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
chromiumoxide = { version = "=0.9.1", default-features = false }
tokio = { version = "=1.53.3", default-features = false }
hyper = { version = "=1.11.1", default-features = false }
hyper-util = { version = "=0.1.21", default-features = false }
http-body-util = { version = "=0.1.5", default-features = false }
reqwest = { version = "=0.13.5", default-features = false }
base64 = { version = "=0.23.1", default-features = false }
signal-hook = { version = "=0.3.18", default-features = false }
globset = { version = "=0.4.20", default-features = false }
percent-encoding = "=2.3.2"
httpdate = "=1.0.3"
regex = "=1.13.1"
regex-syntax = { version = "=0.8.11", default-features = false, features = ["std"] }
maestro-text = { path = "crates/maestro-text" }
maestro-listeners = { path = "crates/maestro-listeners" }
interprocess = { version = "=2.4.2", default-features = false }
maestro-dependencies = { path = "crates/maestro-dependencies" }
maestro-test-process = { path = "crates/maestro-test-process" }
maestro-test-fixtures = { path = "crates/maestro-test-fixtures" }
maestro-test-directory = { path = "crates/maestro-test-directory" }
maestro-test-tracing = { path = "crates/maestro-test-tracing" }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }
num-bigint = "=0.4.8"
num-traits = "=0.2.19"
nix = { version = "=0.31.3", default-features = false, features = ["signal"] }
rustix = { version = "=1.1.6", default-features = false }
ryu-js = "=1.0.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip"] }

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Orchestration-Maestro/maestro"

[workspace.lints.rust]
unsafe_code = "forbid"
forbidden_lint_groups = "forbid"

[workspace.lints.clippy]
pedantic = { level = "forbid", priority = -1 }
module_name_repetitions = "forbid"
missing_docs_in_private_items = "forbid"
redundant_clone = "forbid"
too_many_arguments = "forbid"
fn_params_excessive_bools = "forbid"
too_many_lines = "forbid"
cognitive_complexity = "forbid"
excessive_nesting = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[profile.dev]
debug = "line-tables-only"

# Dev backtraces need file:line for workspace code only; dependency line tables take target space.
[profile.dev.package."*"]
debug = false

# Tests compile extension components; an unoptimised code generator makes each compile about five times slower.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

# The conventions tests parse and lex every workspace source; unoptimised parsers and lexer nearly double their time.
[profile.dev.package.syn]
opt-level = 3

[profile.dev.package.proc-macro2]
opt-level = 3

[profile.dev.package.ra-ap-rustc_lexer]
opt-level = 3

# Image and archive tests deflate and encode hundreds of megabytes; unoptimised codecs make them about eleven times slower.
[profile.dev.package.png]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3

# Markdown, highlighting and the hook's conventions check run through it, two to three times slower unoptimised.
[profile.dev.package.regress]
opt-level = 3

# The test setup hashes the lock files on every nextest run; an unoptimised digest makes the reused-directory path about three times slower.
[profile.dev.package.sha2]
opt-level = 3

# Test binaries skip line tables, which cost about 17% of a large test unit's compile CPU; panic messages keep file:line.
[profile.test]
debug = false
