[package]
name = "maestro-test-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
maestro-daemon = { path = "../crates/maestro-daemon" }
maestro-markdown = { path = "../crates/maestro-markdown" }
maestro-models = { path = "../crates/maestro-models" }
maestro-protocol = { path = "../crates/maestro-protocol" }
maestro-resources = { path = "../crates/maestro-resources" }
maestro-terminal = { path = "../crates/maestro-terminal" }
maestro-tui = { path = "../crates/maestro-tui" }
maestro-test-browser = { path = "../crates/maestro-test-browser" }
maestro-web = { path = "../crates/maestro-web" }

[[bin]]
name = "sandbox-lowering"
path = "fuzz_targets/sandbox_lowering.rs"
test = false
doc = false
bench = false

[[bin]]
name = "browser-resource-paths"
path = "fuzz_targets/browser_resource_paths.rs"
test = false
doc = false
bench = false

[[bin]]
name = "git-worktrees"
