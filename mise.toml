# Development tools are pinned here; Rust is managed by rustup.
[settings]
lockfile = true

[tool_alias]
prek = "github:j178/prek"

[tools]
# Runs the shared development recipes.
just = "1.58.0"
# Installs and runs commit hooks.
prek = { version = "0.5.4", matching = "x86_64-unknown-linux-musl" }

# Watches compiler inputs with native argument forwarding.
watchexec = "2.8.0"
