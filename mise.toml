# Development tools are pinned here; Rust is managed by rustup.
[settings]
lockfile = true

[tool_alias]
prek = "github:j178/prek"
cargo-hakari = "github:guppy-rs/guppy"

[tools]
# Runs the shared development recipes.
just = "1.58.0"
# Installs and runs commit hooks.
prek = "0.5.4"
# Refuses a secret in the staged change before it is committed.
gitleaks = "8.30.1"

# Watches compiler inputs with native argument forwarding.
watchexec = "2.8.0"

# Finds attachment paths in native completion tests.
fd = "10.5.0"

# Runs ordinary tests in isolated processes.
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"

# Unifies native dependency features; `just check` verifies the result.
cargo-hakari = { version = "0.9.39", version_prefix = "cargo-hakari-", matching = "cargo-hakari" }

# Native browser author tools; never consumer install hooks.
"github:trunk-rs/trunk" = { version = "0.21.14" }
"github:wasm-bindgen/wasm-bindgen" = { version = "0.2.129" }
"github:WebAssembly/binaryen" = { version = "133", version_prefix = "version_" }
"github:svenstaro/miniserve" = { version = "0.35.0" }
